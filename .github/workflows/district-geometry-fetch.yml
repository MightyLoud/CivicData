name: District geometry fetch candidate

on:
  pull_request:
    paths:
      - "tools/fetch_district_geometry.py"
      - "tools/discover_arvada_arcgis.py"
      - "data/normalized/co/jurisdiction-co-alamosa/jurisdiction.json"
      - "data/normalized/co/jurisdiction-co-arvada/jurisdiction.json"
      - ".github/workflows/district-geometry-fetch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Fetch and verify district geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve official Arvada map backing layers
        run: |
          mkdir -p artifacts/district-geometry
          python tools/discover_arvada_arcgis.py | tee artifacts/district-geometry/arvada_arcgis_discovery.json
      - name: Fetch official ArcGIS polygons and build diagnostics
        run: python tools/fetch_district_geometry.py --diagnostic --output-dir artifacts/district-geometry
      - name: Show verification
        run: |
          cat artifacts/district-geometry/source_manifest.json
          cat artifacts/district-geometry/verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: district-geometry
          path: artifacts/district-geometry
          if-no-files-found: error
      - name: Enforce all eight point-in-polygon controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/district-geometry/verification.json").read_text())
          if p.get("count") != 8 or p.get("passed") is not True:
              raise SystemExit("district geometry verification failed")
          print("PASS")
          PY
      - name: Pin successful geometry artifacts to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p data/geometry/co
          cp artifacts/district-geometry/alamosa_wards.geojson data/geometry/co/alamosa_wards.geojson
          cp artifacts/district-geometry/arvada_council_districts.geojson data/geometry/co/arvada_council_districts.geojson
          cp artifacts/district-geometry/control_points.json data/geometry/co/district_control_points.json
          cp artifacts/district-geometry/verification.json data/geometry/co/district_geometry_verification.json
          cp artifacts/district-geometry/source_manifest.json data/geometry/co/district_geometry_manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geometry/co
          if git diff --cached --quiet; then
            echo "Pinned geometry already current."
            exit 0
          fi
          git commit -m "Pin verified Alamosa and Arvada district geometry"
          git push origin HEAD:${{ github.head_ref }}
