name: Audit Brazos runtime pins

on:
  push:
    branches:
      - agent/brazos-actions-remediation
    paths:
      - '.github/workflows/brazos-runtime-pin-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brazos-actions-remediation
      - name: List remaining pre-Brazos runtime SHA references
        shell: bash
        run: |
          set -euo pipefail
          grep -RIn --exclude-dir=.git --exclude-dir=civic_gps_runtime_parts \
            '1969e0e6760bdf4e479bd01fa6976f2ea25dd5fdc14e53d0f4b861cde97549ba' . || true
