name: Civic GPS live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/civic-gps-live-smoke'
    paths:
      - 'tools/package_denton_runtime.py'
      - '.github/workflows/civic-gps-live-smoke.yml'

permissions:
  contents: write

concurrency:
  group: civic-gps-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Civic GPS release gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified pre-Denton runtime
        shell: bash
        run: |
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo 'fef242729e6e2efeb0a92c9f81bd19c31a3533ac2b3d44d4e5024ba392ee487b  civic_gps_runtime.zip' | sha256sum --check --strict
          unzip -q civic_gps_runtime.zip

      - name: Build deterministic Denton package
        run: python tools/package_denton_runtime.py

      - name: Validate packaged structure
        shell: bash
        run: |
          echo '66f876c59809849b36ab837e942ac2465e2c32936cf44f1cbe8aa65795ee04c7  civic_gps_runtime.zip' | sha256sum --check --strict
          python -m py_compile civic_gps/engine.py
          python - <<'PY'
          import json
          from pathlib import Path
          reg = json.loads(Path('civic_gps/registry.json').read_text())
          rel = json.loads(Path('civic_gps/civic_gps_denton_county_v0.1.json').read_text())
          assert reg['engine_version'] == '0.6.0'
          assert reg['registry_artifact_version'] == '0.5.0'
          denton = [b for b in reg['bundles'] if b['adapter_id'] == 'ADAPTER-TX-DENTON']
          assert len(denton) == 1
          assert len(rel['payload']['offices']) == 22
          assert len(rel['payload']['officeholders']) == 22
          assert all(a['failure_scope'] == 'ADAPTER' for a in denton[0]['district_adapters'])
          print('PASS: packaged Denton registry/release structure')
          PY

      - name: Commit runtime chunks only
        shell: bash
        run: |
          git config user.name 'Creyton Loud'
          git config user.email 'creytonloud2@gmail.com'
          git add civic_gps_runtime_parts/part.*
          git diff --cached --quiet && { echo 'No runtime chunk changes'; exit 1; }
          git commit -m 'Package Denton County runtime [skip ci]'
          git push origin HEAD:agent/civic-gps-live-smoke
