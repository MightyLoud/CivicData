name: Civic GPS live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/civic-gps-live-smoke'
    paths:
      - 'civic_gps_runtime.zip'
      - 'tests/civic_gps_live_smoke.py'
      - 'requirements-civic-gps.txt'
      - '.github/workflows/civic-gps-live-smoke.yml'
  schedule:
    - cron: '23 15 * * 3'

permissions:
  contents: read

concurrency:
  group: civic-gps-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-civic-gps.txt

      - name: Install Civic GPS runtime dependency
        run: python -m pip install -r requirements-civic-gps.txt

      - name: Expand exact Civic GPS runtime package
        run: unzip -q civic_gps_runtime.zip

      - name: Compile engine and smoke test
        run: python -m py_compile civic_gps/engine.py tests/civic_gps_live_smoke.py

      - name: Run real-network Civic GPS controls
        run: python tests/civic_gps_live_smoke.py

      - name: Upload live responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-live-smoke-${{ github.run_id }}
          path: artifacts/civic-gps-live-smoke/
          if-no-files-found: warn
          retention-days: 30
