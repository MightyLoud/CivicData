name: Civic GPS Denton action packager

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/civic-gps-denton-actions'
    paths:
      - 'tools/package_denton_actions.py'
      - '.github/workflows/civic-gps-live-smoke.yml'

permissions:
  contents: write

concurrency:
  group: civic-gps-denton-action-packager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Denton action runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct verified geography runtime
        shell: bash
        run: |
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo '66f876c59809849b36ab837e942ac2465e2c32936cf44f1cbe8aa65795ee04c7  civic_gps_runtime.zip' | sha256sum --check --strict
          unzip -q civic_gps_runtime.zip

      - name: Build deterministic Denton action package
        run: python tools/package_denton_actions.py

      - name: Verify packaged runtime
        shell: bash
        run: |
          echo 'ea4e10ac250582f01e0a5eabb74837cd987325dfafb30c4111121c4e7c950c9b  civic_gps_runtime.zip' | sha256sum --check --strict
          python -m py_compile civic_gps/engine.py
          test -f civic_gps_runtime_parts/part.05

      - name: Commit runtime chunks only
        shell: bash
        run: |
          git config user.name 'Creyton Loud'
          git config user.email 'creytonloud2@gmail.com'
          git add civic_gps_runtime_parts/part.*
          git diff --cached --quiet && { echo 'No runtime chunk changes'; exit 1; }
          git commit -m 'Package Denton action routing runtime [skip ci]'
          git push origin HEAD:agent/civic-gps-denton-actions
