name: Civic GPS live smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'civic_gps_runtime_parts/**'
      - 'tests/civic_gps_live_smoke.py'
      - 'tests/civic_gps_denton_live_probe.py'
      - 'tests/civic_gps_denton_negative_probe.py'
      - 'tests/civic_gps_denton_boundary_probe.py'
      - 'tests/civic_gps_denton_action_probe.py'
      - 'tests/civic_gps_collin_live_probe.py'
      - 'tests/civic_gps_travis_live_probe.py'
      - 'tests/civic_gps_williamson_live_probe.py'
      - 'tests/civic_gps_tarrant_live_probe.py'
      - 'tests/civic_gps_bastrop_live_probe.py'
      - 'tests/civic_gps_brazos_live_probe.py'
      - 'tests/civic_gps_smith_live_probe.py'
      - 'tests/civic_gps_grayson_live_probe.py'
      - 'tests/civic_gps_lubbock_live_probe.py'
      - 'tests/civic_gps_county_onboarding_test.py'
      - 'tests/civic_gps_topology_probe_test.py'
      - 'tests/fixtures/civic_gps_county_onboarding/**'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_engine_v0.6.2.patch'
      - 'schemas/civic_gps_county_onboarding_v0.1.schema.json'
      - 'requirements-civic-gps.txt'
      - '.github/workflows/civic-gps-live-smoke.yml'
      - 'docs/workflows/civic-gps-live-smoke.md'
      - 'docs/workflows/civic-gps-county-archetype.md'
      - 'docs/workflows/civic-gps-county-onboarding.md'
  push:
    branches:
      - main
      - 'agent/civic-gps-live-smoke'
    paths:
      - 'civic_gps_runtime_parts/**'
      - 'tests/civic_gps_live_smoke.py'
      - 'tests/civic_gps_denton_live_probe.py'
      - 'tests/civic_gps_denton_negative_probe.py'
      - 'tests/civic_gps_denton_boundary_probe.py'
      - 'tests/civic_gps_denton_action_probe.py'
      - 'tests/civic_gps_collin_live_probe.py'
      - 'tests/civic_gps_travis_live_probe.py'
      - 'tests/civic_gps_williamson_live_probe.py'
      - 'tests/civic_gps_tarrant_live_probe.py'
      - 'tests/civic_gps_bastrop_live_probe.py'
      - 'tests/civic_gps_brazos_live_probe.py'
      - 'tests/civic_gps_smith_live_probe.py'
      - 'tests/civic_gps_grayson_live_probe.py'
      - 'tests/civic_gps_lubbock_live_probe.py'
      - 'tests/civic_gps_county_onboarding_test.py'
      - 'tests/civic_gps_topology_probe_test.py'
      - 'tests/fixtures/civic_gps_county_onboarding/**'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_engine_v0.6.2.patch'
      - 'schemas/civic_gps_county_onboarding_v0.1.schema.json'
      - 'requirements-civic-gps.txt'
      - '.github/workflows/civic-gps-live-smoke.yml'
      - 'docs/workflows/civic-gps-live-smoke.md'
      - 'docs/workflows/civic-gps-county-archetype.md'
      - 'docs/workflows/civic-gps-county-onboarding.md'
  schedule:
    - cron: '23 15 * * 3'
    # One-time unattended proof authorized for 2026-08-15; remove after the run is recorded.
    - cron: '23 22 15 8 *'

permissions:
  contents: read

concurrency:
  group: civic-gps-live-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Civic GPS release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CIVIC_GPS_EXPECTED_REGISTRY_VERSION: '0.6.2'
      CIVIC_GPS_EXPECTED_BUNDLE_COUNT: '14'
      CIVIC_GPS_EXPECTED_RUNTIME_SHA256: '1969e0e6760bdf4e479bd01fa6976f2ea25dd5fdc14e53d0f4b861cde97549ba'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-civic-gps.txt

      - name: Install Civic GPS runtime dependency
        run: python -m pip install -r requirements-civic-gps.txt

      - name: Reconstruct exact Civic GPS runtime package
        shell: bash
        run: |
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo '1969e0e6760bdf4e479bd01fa6976f2ea25dd5fdc14e53d0f4b861cde97549ba  civic_gps_runtime.zip' | sha256sum --check --strict
          unzip -q civic_gps_runtime.zip

      - name: Compile engine, onboarding tool, and smoke tests
        run: python -m py_compile civic_gps/engine.py tools/civic_gps_tx_county_archetype.py tools/civic_gps_county_onboarding.py tests/civic_gps_county_onboarding_test.py tests/civic_gps_topology_probe_test.py tests/civic_gps_live_smoke.py tests/civic_gps_denton_live_probe.py tests/civic_gps_denton_negative_probe.py tests/civic_gps_denton_boundary_probe.py tests/civic_gps_denton_action_probe.py tests/civic_gps_collin_live_probe.py tests/civic_gps_travis_live_probe.py tests/civic_gps_williamson_live_probe.py tests/civic_gps_tarrant_live_probe.py tests/civic_gps_bastrop_live_probe.py tests/civic_gps_brazos_live_probe.py tests/civic_gps_smith_live_probe.py tests/civic_gps_grayson_live_probe.py tests/civic_gps_lubbock_live_probe.py

      - name: Run deterministic County Onboarding Pipeline fixtures
        shell: bash
        run: |
          rm -rf artifacts/civic-gps-county-onboarding
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/williamson_supported_v0.1.json --output-dir artifacts/civic-gps-county-onboarding/williamson --expect SUPPORTED_V0_1
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/hays_multi_office_stop_v0.1.json --output-dir artifacts/civic-gps-county-onboarding/hays --expect MULTI_OFFICE_PER_DISTRICT
          python tests/civic_gps_county_onboarding_test.py
          python tests/civic_gps_topology_probe_test.py

      - name: Run baseline real-network Civic GPS controls
        run: python tests/civic_gps_live_smoke.py

      - name: Run packaged Denton live controls
        run: python tests/civic_gps_denton_live_probe.py

      - name: Run packaged Denton outside-county negative control
        run: python tests/civic_gps_denton_negative_probe.py

      - name: Run packaged Denton boundary fail-closed controls
        run: python tests/civic_gps_denton_boundary_probe.py

      - name: Run Denton action selection contract
        run: python tests/civic_gps_denton_action_probe.py

      - name: Run packaged Collin County archetype controls
        run: python tests/civic_gps_collin_live_probe.py

      - name: Run packaged Travis County archetype controls
        run: python tests/civic_gps_travis_live_probe.py

      - name: Run packaged Williamson County archetype controls
        run: python tests/civic_gps_williamson_live_probe.py

      - name: Run packaged Tarrant County archetype controls
        run: python tests/civic_gps_tarrant_live_probe.py

      - name: Run packaged Bastrop County archetype controls
        run: python tests/civic_gps_bastrop_live_probe.py

      - name: Run packaged Brazos County archetype controls
        run: python tests/civic_gps_brazos_live_probe.py

      - name: Run packaged Smith County archetype controls
        run: python tests/civic_gps_smith_live_probe.py --packaged --expected-runtime-sha256 "$CIVIC_GPS_EXPECTED_RUNTIME_SHA256"

      - name: Run packaged Grayson County archetype controls
        run: python tests/civic_gps_grayson_live_probe.py --packaged --expected-runtime-sha256 "$CIVIC_GPS_EXPECTED_RUNTIME_SHA256"

      - name: Run packaged Lubbock County archetype controls
        run: python tests/civic_gps_lubbock_live_probe.py --expected-runtime-sha256 "$CIVIC_GPS_EXPECTED_RUNTIME_SHA256"

      - name: Upload live responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-live-smoke-${{ github.run_id }}
          path: |
            artifacts/civic-gps-county-onboarding/
            artifacts/civic-gps-live-smoke/
            artifacts/civic-gps-travis-archetype/
            artifacts/civic-gps-williamson-cg09/
            artifacts/civic-gps-tarrant-cg09/
            artifacts/civic-gps-bastrop-cg09/
            artifacts/civic-gps-brazos-cg09/
            artifacts/civic-gps-smith-cg10/
            artifacts/civic-gps-grayson-cg10/
            artifacts/civic-gps-lubbock-cg10/
          if-no-files-found: warn
          retention-days: 30
