name: 'Civic GPS Bastrop County #6 onboarding'

on:
  push:
    branches:
      - 'agent/civic-gps-bastrop-onboarding'
    paths:
      - '.github/workflows/civic-gps-bastrop-county6-onboarding.yml'
      - 'tests/fixtures/civic_gps_county_onboarding/bastrop_county6_candidate_v0.1.json'
      - 'tests/fixtures/civic_gps_county_onboarding/bastrop_cg04_cg05_proof_v0.1.json'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tools/civic_gps_bastrop_cg04_cg05.py'

permissions:
  contents: read

jobs:
  county-gates:
    name: Bastrop County automated CG-01 to CG-05
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out County #6 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile onboarding and live-proof tooling
        run: python -m py_compile tools/civic_gps_county_onboarding.py tools/civic_gps_tx_county_archetype.py tools/civic_gps_bastrop_cg04_cg05.py

      - name: Run frozen Bastrop spec twice
        shell: bash
        run: |
          rm -rf artifacts/civic-gps-bastrop-county6-a artifacts/civic-gps-bastrop-county6-b
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/bastrop_county6_candidate_v0.1.json --output-dir artifacts/civic-gps-bastrop-county6-a --expect SUPPORTED_V0_1
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/bastrop_county6_candidate_v0.1.json --output-dir artifacts/civic-gps-bastrop-county6-b --expect SUPPORTED_V0_1

      - name: Prove deterministic frozen outputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          a=Path('artifacts/civic-gps-bastrop-county6-a')
          b=Path('artifacts/civic-gps-bastrop-county6-b')
          def snapshot(root):
              out={}
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      out[str(p.relative_to(root))]=hashlib.sha256(p.read_bytes()).hexdigest()
              return out
          sa,sb=snapshot(a),snapshot(b)
          if sa != sb:
              raise SystemExit(f'non-deterministic outputs: {sa} != {sb}')
          print(json.dumps({'status':'PASS','files':sa}, sort_keys=True))
          PY

      - name: Run live CG-04 and CG-05 twice
        shell: bash
        run: |
          rm -rf artifacts/civic-gps-bastrop-cg04-cg05-a artifacts/civic-gps-bastrop-cg04-cg05-b
          python tools/civic_gps_bastrop_cg04_cg05.py tests/fixtures/civic_gps_county_onboarding/bastrop_county6_candidate_v0.1.json tests/fixtures/civic_gps_county_onboarding/bastrop_cg04_cg05_proof_v0.1.json --output-dir artifacts/civic-gps-bastrop-cg04-cg05-a
          python tools/civic_gps_bastrop_cg04_cg05.py tests/fixtures/civic_gps_county_onboarding/bastrop_county6_candidate_v0.1.json tests/fixtures/civic_gps_county_onboarding/bastrop_cg04_cg05_proof_v0.1.json --output-dir artifacts/civic-gps-bastrop-cg04-cg05-b

      - name: Prove deterministic live assertions and CG-06 stop
        shell: bash
        run: |
          cmp artifacts/civic-gps-bastrop-cg04-cg05-a/cg04_cg05_evidence.json artifacts/civic-gps-bastrop-cg04-cg05-b/cg04_cg05_evidence.json
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('artifacts/civic-gps-bastrop-cg04-cg05-a/cg04_cg05_evidence.json')
          value=json.loads(p.read_text())
          gates={row['gate']: row['status'] for row in value['gates']}
          if gates['CG-04'] != 'PASS' or gates['CG-05'] != 'PASS' or gates['CG-06'] != 'READY':
              raise SystemExit(f'unexpected gate state: {gates}')
          if value['stopped_before'] != 'CG-06' or value['packaged'] is not False:
              raise SystemExit('proof crossed the CG-06/package stop')
          print(json.dumps({'status':'PASS','sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'stopped_before':'CG-06'}, sort_keys=True))
          PY

      - name: Upload County #6 CG-01 to CG-05 evidence
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-bastrop-county6-cg01-cg05-${{ github.run_id }}
          path: |
            artifacts/civic-gps-bastrop-county6-a/
            artifacts/civic-gps-bastrop-cg04-cg05-a/
          if-no-files-found: error
          retention-days: 30
