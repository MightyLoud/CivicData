name: 'Civic GPS Grayson County #10 onboarding'

on:
  push:
    branches:
      - 'agent/civic-gps-grayson-intake'
    paths:
      - '.github/workflows/civic-gps-grayson-county10-onboarding.yml'
      - 'tests/fixtures/civic_gps_county_onboarding/grayson_county10_candidate_v0.1.json'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tests/civic_gps_grayson_live_probe.py'
      - 'civic_gps_runtime_parts/part.*'
      - 'requirements-civic-gps.txt'

permissions:
  contents: read

jobs:
  fit-screen:
    name: Grayson County automated CG-01 to CG-03
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Check out County #10 branch'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile onboarding and live proof tooling
        run: python -m py_compile tools/civic_gps_county_onboarding.py tools/civic_gps_tx_county_archetype.py tests/civic_gps_grayson_live_probe.py

      - name: Run frozen Grayson spec twice
        shell: bash
        run: |
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/grayson_county10_candidate_v0.1.json --output-dir artifacts/civic-gps-grayson-county10-a --expect SUPPORTED_V0_1
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/grayson_county10_candidate_v0.1.json --output-dir artifacts/civic-gps-grayson-county10-b --expect SUPPORTED_V0_1

      - name: Prove deterministic outputs and exact supported result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          a = Path('artifacts/civic-gps-grayson-county10-a')
          b = Path('artifacts/civic-gps-grayson-county10-b')

          def snapshot(root):
              return {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob('*'))
                  if path.is_file()
              }

          left, right = snapshot(a), snapshot(b)
          if left != right:
              raise SystemExit(f'non-deterministic outputs: {left} != {right}')

          expected_files = {
              'base-bundle-plan.json',
              'builder-spec.json',
              'canonical-release-preview.json',
              'fit-report.json',
              'manifest.json',
              'proof-plan.json',
              'source-precedence.json',
          }
          if set(left) != expected_files:
              raise SystemExit(f'unexpected evidence files: {sorted(left)}')

          report = json.loads((a / 'fit-report.json').read_text())
          expected = {
              'decision': 'GO',
              'result': 'SUPPORTED_V0_1',
              'stop_class': 'NONE',
              'stop_classes': [],
              'stop_reasons': {},
              'tracker_fit_result': 'SUPPORTED_V0_1',
              'architecture_change': 'NO',
          }
          actual = {key: report.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'unexpected fit result: {actual} != {expected}')

          proof = json.loads((a / 'proof-plan.json').read_text())
          gates = {row['gate']: row['status'] for row in proof['gates']}
          expected_gates = {
              'CG-01': 'PASS',
              'CG-02': 'PASS',
              'CG-03': 'PASS',
              'CG-04': 'READY',
              'CG-05': 'READY',
              'CG-06': 'READY',
              'CG-07': 'READY',
              'CG-08': 'READY',
              'CG-09': 'READY',
              'CG-10': 'READY',
          }
          if gates != expected_gates:
              raise SystemExit(f'unexpected gate state: {gates} != {expected_gates}')

          release = json.loads((a / 'canonical-release-preview.json').read_text())
          offices = release['payload']['offices']
          holders = release['payload']['officeholders']
          office_ids = [row['office_id'] for row in offices]
          holder_office_ids = [row['office_id'] for row in holders]
          if len(offices) != 18 or len(holders) != 18:
              raise SystemExit(f'expected 18 offices/holders, got {len(offices)}/{len(holders)}')
          if len(set(office_ids)) != 18 or set(holder_office_ids) != set(office_ids):
              raise SystemExit('canonical office/holder joins are not unique and complete')

          bundle = json.loads((a / 'base-bundle-plan.json').read_text())
          adapters = bundle['district_adapters']
          if len(adapters) != 3:
              raise SystemExit(f'expected three district adapters, got {len(adapters)}')
          if any(row['failure_scope'] != 'ADAPTER' for row in adapters):
              raise SystemExit('adapter failure scope changed')
          if any(row['officeholder_identity_source'] != 'CANONICAL_RELEASE_ONLY' for row in adapters):
              raise SystemExit('adapter identity-source contract changed')
          if any(row['boundary_policy'] != 'MULTIPLE_INTERSECTIONS => CONFLICT; NEVER TIE_BREAK' for row in adapters):
              raise SystemExit('boundary policy changed')
          if {row['district_field'] for row in adapters} != {'COMMISSIONER', 'JP_NAME'}:
              raise SystemExit('district-field contract changed')
          if any(row['district_key_normalization'] != 'NUMERIC' for row in adapters):
              raise SystemExit('numeric district-key contract changed')

          precedence = json.loads((a / 'source-precedence.json').read_text())
          if precedence.get('status') != 'RESOLVED' or len(precedence.get('records', [])) != 1:
              raise SystemExit(f'unexpected source precedence: {precedence}')

          print(json.dumps({
              'status': 'PASS',
              'decision': report['decision'],
              'result': report['result'],
              'gates': gates,
              'office_count': len(offices),
              'holder_count': len(holders),
              'files': left,
          }, sort_keys=True))
          PY

  live-proof:
    name: Grayson CG-04 to CG-08 live proof (${{ matrix.proof }})
    needs: fit-screen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        proof: ['a', 'b']
    steps:
      - name: 'Check out County #10 branch'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install live proof dependency
        run: python -m pip install -r requirements-civic-gps.txt

      - name: Run one independent Grayson live proof
        run: python tests/civic_gps_grayson_live_probe.py --output-dir artifacts/civic-gps-grayson-cg08-${{ matrix.proof }}

      - name: 'Upload independent Grayson live evidence'
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-grayson-cg08-${{ matrix.proof }}-${{ github.run_id }}
          path: artifacts/civic-gps-grayson-cg08-${{ matrix.proof }}/
          if-no-files-found: error
          retention-days: 30

  verify-live-proof:
    name: Verify deterministic Grayson CG-04 to CG-08 evidence
    needs: live-proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download independent proof A
        uses: actions/download-artifact@v4
        with:
          name: civic-gps-grayson-cg08-a-${{ github.run_id }}
          path: evidence/a

      - name: Download independent proof B
        uses: actions/download-artifact@v4
        with:
          name: civic-gps-grayson-cg08-b-${{ github.run_id }}
          path: evidence/b

      - name: Prove deterministic Grayson CG-04 through CG-08 result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          left_path = Path('evidence/a/grayson-cg08-summary.json')
          right_path = Path('evidence/b/grayson-cg08-summary.json')
          left_bytes, right_bytes = left_path.read_bytes(), right_path.read_bytes()
          if left_bytes != right_bytes:
              raise SystemExit('Grayson CG-04 through CG-08 summary is not deterministic')

          summary = json.loads(left_bytes)
          expected_gates = {gate: 'PASS' for gate in ('CG-04', 'CG-05', 'CG-06', 'CG-07', 'CG-08')}
          if summary.get('status') != 'PASS' or summary.get('gates') != expected_gates:
              raise SystemExit(f'unexpected live gate state: {summary}')
          if summary.get('next_gate') != 'CG-09' or summary.get('stopped_before') != 'CG-09':
              raise SystemExit(f'unexpected next-gate state: {summary}')
          if summary.get('production_runtime_changed') is not False:
              raise SystemExit('Grayson proof may not change the production runtime')
          if summary.get('runtime_sha256') != '49b54af31cb4687936a2dddb6a91f6305aa7b4977756a3db203562971296a23a':
              raise SystemExit(f'unexpected production runtime SHA: {summary.get("runtime_sha256")}')
          if summary.get('release_offices') != 18 or summary.get('release_holders') != 18:
              raise SystemExit('Grayson canonical release must retain 18 offices and 18 holders')
          if len(summary.get('interior_controls') or []) != 4:
              raise SystemExit('Grayson proof must retain four interior controls')
          if summary.get('outside_negative', {}).get('grayson_leakage') != 0:
              raise SystemExit('Grayson outside-negative leaked county output')
          boundaries = summary.get('boundaries') or {}
          if boundaries.get('commissioner_only', {}).get('exact_applicable_offices') != 8:
              raise SystemExit('Commissioner-only boundary did not preserve eight Grayson offices')
          if boundaries.get('jp_constable_only', {}).get('exact_applicable_offices') != 7:
              raise SystemExit('JP/Constable-only boundary did not preserve seven Grayson offices')
          if boundaries.get('engine_input_mode') != 'LIVE_VERIFIED_REPLAY':
              raise SystemExit('Boundary engine inputs were not grounded in live-verified topology')
          if summary.get('actions') != 'NOT_YET_RELEASED' or summary.get('candidate_packaged') is not False:
              raise SystemExit('Grayson proof crossed the CG-09 or action-routing boundary')
          print(json.dumps({
              'status': 'PASS',
              'gates': summary['gates'],
              'summary_sha256': hashlib.sha256(left_bytes).hexdigest(),
              'runtime_sha256': summary['runtime_sha256'],
              'next_gate': summary['next_gate'],
          }, sort_keys=True))
          PY

      - name: 'Upload County #10 CG-04 through CG-08 evidence'
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-grayson-county10-cg08-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
