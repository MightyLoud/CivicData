name: Build Brazos action candidate once

on:
  push:
    branches:
      - agent/brazos-actions-remediation
    paths:
      - '.github/workflows/brazos-action-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brazos-actions-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize current Brazos archetype wording for governed builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/workflows/civic-gps-county-archetype.md')
          s = p.read_text(encoding='utf-8')
          anchor = "Brazos's v0.1 geography/office package contains 18 canonical offices / 18 holders = 6 deliberately bounded countywide + 4 Commissioner + 4 JP + 4 Constable. All three district families share the official P1–P4 geometry and use the generic one-meter topology probe. Action routing remains `NOT_YET_RELEASED`; additional countywide and judicial offices remain `BOUNDED_V0_1_SCOPE`."
          normalized = "Brazos's v0.1 geography/office package contains 18 canonical offices / 18 holders = 6 deliberately bounded countywide + 4 Commissioner + 4 JP + 4 Constable. All three district families share the official P1–P4 geometry and use the generic one-meter topology probe. Brazos action routing remains `NOT_YET_RELEASED`; additional countywide and judicial offices remain `BOUNDED_V0_1_SCOPE`."
          if anchor not in s:
              raise SystemExit('current Brazos archetype paragraph drifted')
          p.write_text(s.replace(anchor, normalized), encoding='utf-8')
          PY
      - name: Build candidate
        run: python tools/build_brazos_candidate_once.py
      - name: Push non-workflow candidate files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/reference
          cp .github/workflows/civic-gps-live-smoke.yml data/reference/civic-gps-live-smoke-v0.6.3.candidate.yml
          git checkout HEAD -- .github/workflows/civic-gps-live-smoke.yml
          git checkout HEAD -- .github/workflows/brazos-action-build-once.yml
          git checkout HEAD -- .github/workflows/brazos-action-recovery.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Brazos action routing candidate on Civic GPS 0.6.3'
          git push origin HEAD:agent/brazos-actions-remediation
