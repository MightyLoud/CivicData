name: Build Brazos action candidate once

on:
  push:
    branches:
      - agent/brazos-actions-remediation
    paths:
      - '.github/workflows/brazos-action-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brazos-actions-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate
        run: python tools/build_brazos_candidate_once.py
      - name: Commit candidate and remove temporary builder controls
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Brazos action routing on Civic GPS 0.6.3'
          git push origin HEAD:agent/brazos-actions-remediation
