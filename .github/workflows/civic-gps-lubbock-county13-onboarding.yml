name: 'Civic GPS Lubbock County #13 onboarding'

on:
  push:
    branches:
      - 'agent/civic-gps-lubbock-intake'
    paths:
      - '.github/workflows/civic-gps-lubbock-county13-onboarding.yml'
      - 'tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json'
      - 'tests/fixtures/civic_gps_county_onboarding/lubbock_cg04_roster_v0.1.json'
      - 'tests/fixtures/civic_gps_county_onboarding/lubbock_cg05_gis_v0.1.json'
      - 'tests/fixtures/civic_gps_county_onboarding/lubbock_cg06_interiors_v0.1.json'
      - 'tests/fixtures/civic_gps_county_onboarding/lubbock_cg07_outside_v0.1.json'
      - 'tests/fixtures/civic_gps_county_onboarding/lubbock_cg08_boundary_v0.1.json'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tools/civic_gps_lubbock_cg04.py'
      - 'tools/civic_gps_lubbock_cg05.py'
      - 'tools/civic_gps_lubbock_cg06.py'
      - 'tools/civic_gps_lubbock_cg07.py'
      - 'tools/civic_gps_lubbock_cg08.py'

permissions:
  contents: read

jobs:
  fit-screen:
    name: Lubbock County automated CG-01 to CG-03
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out County #13 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile onboarding tooling
        run: python -m py_compile tools/civic_gps_county_onboarding.py tools/civic_gps_tx_county_archetype.py

      - name: Run frozen Lubbock spec twice
        shell: bash
        run: |
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json --output-dir artifacts/civic-gps-lubbock-county13-a --expect SUPPORTED_V0_1
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json --output-dir artifacts/civic-gps-lubbock-county13-b --expect SUPPORTED_V0_1

      - name: Prove deterministic outputs and exact supported result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          a = Path('artifacts/civic-gps-lubbock-county13-a')
          b = Path('artifacts/civic-gps-lubbock-county13-b')

          def snapshot(root):
              return {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob('*'))
                  if path.is_file()
              }

          left, right = snapshot(a), snapshot(b)
          if left != right:
              raise SystemExit(f'non-deterministic outputs: {left} != {right}')

          expected_files = {
              'base-bundle-plan.json',
              'builder-spec.json',
              'canonical-release-preview.json',
              'fit-report.json',
              'manifest.json',
              'proof-plan.json',
              'source-precedence.json',
          }
          if set(left) != expected_files:
              raise SystemExit(f'unexpected evidence files: {sorted(left)}')

          report = json.loads((a / 'fit-report.json').read_text())
          expected = {
              'decision': 'GO',
              'result': 'SUPPORTED_V0_1',
              'stop_class': 'NONE',
              'stop_classes': [],
              'stop_reasons': {},
              'tracker_fit_result': 'SUPPORTED_V0_1',
              'architecture_change': 'NO',
          }
          actual = {key: report.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'unexpected fit result: {actual} != {expected}')

          proof = json.loads((a / 'proof-plan.json').read_text())
          gates = {row['gate']: row['status'] for row in proof['gates']}
          expected_gates = {
              'CG-01': 'PASS',
              'CG-02': 'PASS',
              'CG-03': 'PASS',
              'CG-04': 'READY',
              'CG-05': 'READY',
              'CG-06': 'READY',
              'CG-07': 'READY',
              'CG-08': 'READY',
              'CG-09': 'READY',
              'CG-10': 'READY',
          }
          if gates != expected_gates:
              raise SystemExit(f'unexpected gate state: {gates} != {expected_gates}')

          release = json.loads((a / 'canonical-release-preview.json').read_text())
          offices = release['payload']['offices']
          holders = release['payload']['officeholders']
          office_ids = [row['office_id'] for row in offices]
          holder_office_ids = [row['office_id'] for row in holders]
          if len(offices) != 18 or len(holders) != 18:
              raise SystemExit(f'expected 18 offices/holders, got {len(offices)}/{len(holders)}')
          if len(set(office_ids)) != 18 or set(holder_office_ids) != set(office_ids):
              raise SystemExit('canonical office/holder joins are not unique and complete')

          bundle = json.loads((a / 'base-bundle-plan.json').read_text())
          adapters = bundle['district_adapters']
          if len(adapters) != 3:
              raise SystemExit(f'expected three district adapters, got {len(adapters)}')
          if any(row['failure_scope'] != 'ADAPTER' for row in adapters):
              raise SystemExit('adapter failure scope changed')
          if any(row['officeholder_identity_source'] != 'CANONICAL_RELEASE_ONLY' for row in adapters):
              raise SystemExit('adapter identity-source contract changed')
          if any(row['boundary_policy'] != 'MULTIPLE_INTERSECTIONS => CONFLICT; NEVER TIE_BREAK' for row in adapters):
              raise SystemExit('boundary policy changed')
          if {row['district_field'] for row in adapters} != {'District_ID'}:
              raise SystemExit('district-field contract changed')
          if any(row['district_key_normalization'] != 'NUMERIC' for row in adapters):
              raise SystemExit('numeric district-key contract changed')

          precedence = json.loads((a / 'source-precedence.json').read_text())
          if precedence.get('status') != 'RESOLVED' or precedence.get('records') != []:
              raise SystemExit(f'unexpected source precedence: {precedence}')

          print(json.dumps({
              'status': 'PASS',
              'decision': report['decision'],
              'result': report['result'],
              'gates': gates,
              'office_count': len(offices),
              'holder_count': len(holders),
              'files': left,
          }, sort_keys=True))
          PY

      - name: Upload County #13 fit evidence
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-lubbock-county13-${{ github.run_id }}
          path: artifacts/civic-gps-lubbock-county13-a/
          if-no-files-found: error
          retention-days: 30

  canonical-roster-proof:
    name: Lubbock County CG-04 canonical-roster proof
    needs: fit-screen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out County #13 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile CG-04 proof tooling
        run: python -m py_compile tools/civic_gps_lubbock_cg04.py

      - name: Run live CG-04 proof twice
        shell: bash
        run: |
          python tools/civic_gps_lubbock_cg04.py tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json tests/fixtures/civic_gps_county_onboarding/lubbock_cg04_roster_v0.1.json --output-dir artifacts/civic-gps-lubbock-cg04-a
          python tools/civic_gps_lubbock_cg04.py tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json tests/fixtures/civic_gps_county_onboarding/lubbock_cg04_roster_v0.1.json --output-dir artifacts/civic-gps-lubbock-cg04-b

      - name: Prove deterministic exact CG-04 result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          left_path = Path('artifacts/civic-gps-lubbock-cg04-a/lubbock-cg04-evidence.json')
          right_path = Path('artifacts/civic-gps-lubbock-cg04-b/lubbock-cg04-evidence.json')
          left_bytes, right_bytes = left_path.read_bytes(), right_path.read_bytes()
          if left_bytes != right_bytes:
              raise SystemExit('Lubbock CG-04 evidence is not deterministic')

          report = json.loads(left_bytes)
          expected_gates = {
              'CG-01': 'PASS',
              'CG-02': 'PASS',
              'CG-03': 'PASS',
              'CG-04': 'PASS',
              'CG-05': 'READY',
              'CG-06': 'READY',
              'CG-07': 'READY',
              'CG-08': 'READY',
              'CG-09': 'READY',
              'CG-10': 'READY',
          }
          gates = {row['gate']: row['status'] for row in report['gates']}
          if gates != expected_gates:
              raise SystemExit(f'unexpected gate state: {gates}')
          roster = report['cg04_canonical_roster']
          if roster.get('status') != 'PASS':
              raise SystemExit('CG-04 roster status is not PASS')
          if roster.get('expected_total_offices') != 18 or roster.get('verified_total_offices') != 18:
              raise SystemExit('CG-04 did not verify all 18 bounded offices')
          records = roster.get('records') or []
          if len(records) != 18 or len({row['office_id'] for row in records}) != 18:
              raise SystemExit('CG-04 roster evidence is incomplete or duplicated')
          if roster.get('identity_source_rule') != 'CANONICAL_RELEASE_ONLY' or roster.get('identity_conflicts') != 0:
              raise SystemExit('CG-04 identity-source contract changed')
          if report.get('candidate_spec_sha256') != '20dad659a7bb3b9cfcd8ec5979827eed328aeb346bd42287dce2a6247b655fe2':
              raise SystemExit('frozen candidate SHA changed')
          if report.get('stopped_before') != 'CG-05' or report.get('packaged') is not False:
              raise SystemExit('CG-04 crossed the CG-05/package boundary')
          if report.get('actions') != 'NOT_YET_RELEASED' or report.get('production_runtime_changed') is not False:
              raise SystemExit('CG-04 crossed the action or production boundary')
          print(json.dumps({
              'status': 'PASS',
              'gate': 'CG-04',
              'verified_offices': roster['verified_total_offices'],
              'source_pages': roster['source_page_count'],
              'evidence_sha256': hashlib.sha256(left_bytes).hexdigest(),
              'next_gate': 'CG-05',
          }, sort_keys=True))
          PY

      - name: Upload County #13 CG-04 evidence
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-lubbock-county13-cg04-${{ github.run_id }}
          path: artifacts/civic-gps-lubbock-cg04-a/
          if-no-files-found: error
          retention-days: 30

  gis-adapter-proof:
    name: Lubbock County CG-05 live GIS-adapter proof
    needs: canonical-roster-proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out County #13 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile CG-05 proof tooling
        run: python -m py_compile tools/civic_gps_lubbock_cg05.py

      - name: Run live CG-05 proof twice
        shell: bash
        run: |
          python tools/civic_gps_lubbock_cg05.py tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json tests/fixtures/civic_gps_county_onboarding/lubbock_cg05_gis_v0.1.json --output-dir artifacts/civic-gps-lubbock-cg05-a
          python tools/civic_gps_lubbock_cg05.py tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json tests/fixtures/civic_gps_county_onboarding/lubbock_cg05_gis_v0.1.json --output-dir artifacts/civic-gps-lubbock-cg05-b

      - name: Prove deterministic exact CG-05 result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          left_path = Path('artifacts/civic-gps-lubbock-cg05-a/lubbock-cg05-evidence.json')
          right_path = Path('artifacts/civic-gps-lubbock-cg05-b/lubbock-cg05-evidence.json')
          left_bytes, right_bytes = left_path.read_bytes(), right_path.read_bytes()
          if left_bytes != right_bytes:
              raise SystemExit('Lubbock CG-05 evidence is not deterministic')

          report = json.loads(left_bytes)
          expected_gates = {
              'CG-01': 'PASS',
              'CG-02': 'PASS',
              'CG-03': 'PASS',
              'CG-04': 'PASS',
              'CG-05': 'PASS',
              'CG-06': 'READY',
              'CG-07': 'READY',
              'CG-08': 'READY',
              'CG-09': 'READY',
              'CG-10': 'READY',
          }
          gates = {row['gate']: row['status'] for row in report['gates']}
          if gates != expected_gates:
              raise SystemExit(f'unexpected gate state: {gates}')
          gis = report['cg05_gis_adapter']
          if gis.get('status') != 'PASS' or gis.get('shared_geometry') is not True:
              raise SystemExit('CG-05 shared GIS adapter did not pass')
          if gis.get('families') != ['commissioner', 'justice_of_the_peace', 'constable']:
              raise SystemExit('CG-05 district-family contract changed')
          if len(gis.get('adapter_ids') or []) != 3:
              raise SystemExit('CG-05 must retain three district adapters')
          if gis.get('layer_name') != 'Precinct Boundaries' or gis.get('geometry_type') != 'esriGeometryPolygon':
              raise SystemExit('CG-05 polygon layer identity changed')
          if gis.get('district_field') != 'District_ID' or gis.get('district_field_type') != 'esriFieldTypeSmallInteger':
              raise SystemExit('CG-05 district-field contract changed')
          if gis.get('district_keys') != ['1', '2', '3', '4'] or gis.get('feature_count') != 4:
              raise SystemExit('CG-05 live district keys/features changed')
          if len(gis.get('provenance_chain') or []) != 7:
              raise SystemExit('CG-05 provenance chain is incomplete')
          if gis.get('failure_scope') != 'ADAPTER' or gis.get('officeholder_identity_source') != 'CANONICAL_RELEASE_ONLY':
              raise SystemExit('CG-05 adapter isolation or identity-source contract changed')
          if report.get('candidate_spec_sha256') != '20dad659a7bb3b9cfcd8ec5979827eed328aeb346bd42287dce2a6247b655fe2':
              raise SystemExit('frozen candidate SHA changed')
          if report.get('stopped_before') != 'CG-06' or report.get('packaged') is not False:
              raise SystemExit('CG-05 crossed the CG-06/package boundary')
          if report.get('actions') != 'NOT_YET_RELEASED' or report.get('production_runtime_changed') is not False:
              raise SystemExit('CG-05 crossed the action or production boundary')
          print(json.dumps({
              'status': 'PASS',
              'gate': 'CG-05',
              'district_keys': gis['district_keys'],
              'feature_count': gis['feature_count'],
              'provenance_hops': len(gis['provenance_chain']),
              'evidence_sha256': hashlib.sha256(left_bytes).hexdigest(),
              'next_gate': 'CG-06',
          }, sort_keys=True))
          PY

      - name: Upload County #13 CG-05 evidence
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-lubbock-county13-cg05-${{ github.run_id }}
          path: artifacts/civic-gps-lubbock-cg05-a/
          if-no-files-found: error
          retention-days: 30

  interior-control-proof:
    name: Lubbock County CG-06 coordinate-only interior proof
    needs: gis-adapter-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out County #13 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile CG-06 proof tooling
        run: python -m py_compile tools/civic_gps_lubbock_cg06.py

      - name: Run live coordinate-only CG-06 proof twice
        shell: bash
        run: |
          python tools/civic_gps_lubbock_cg06.py \
            tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json \
            tests/fixtures/civic_gps_county_onboarding/lubbock_cg04_roster_v0.1.json \
            tests/fixtures/civic_gps_county_onboarding/lubbock_cg05_gis_v0.1.json \
            tests/fixtures/civic_gps_county_onboarding/lubbock_cg06_interiors_v0.1.json \
            --output-dir artifacts/civic-gps-lubbock-cg06-a
          python tools/civic_gps_lubbock_cg06.py \
            tests/fixtures/civic_gps_county_onboarding/lubbock_county13_candidate_v0.1.json \
            tests/fixtures/civic_gps_county_onboarding/lubbock_cg04_roster_v0.1.json \
            tests/fixtures/civic_gps_county_onboarding/lubbock_cg05_gis_v0.1.json \
            tests/fixtures/civic_gps_county_onboarding/lubbock_cg06_interiors_v0.1.json \
            --output-dir artifacts/civic-gps-lubbock-cg06-b

      - name: Prove deterministic exact CG-06 result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          left_path = Path('artifacts/civic-gps-lubbock-cg06-a/lubbock-cg06-evidence.json')
          right_path = Path('artifacts/civic-gps-lubbock-cg06-b/lubbock-cg06-evidence.json')
          left_bytes, right_bytes = left_path.read_bytes(), right_path.read_bytes()
          if left_bytes != right_bytes:
              raise SystemExit('Lubbock CG-06 evidence is not deterministic')

          report = json.loads(left_bytes)
          expected_gates = {
              'CG-01': 'PASS',
              'CG-02': 'PASS',
              'CG-03': 'PASS',
              'CG-04': 'PASS',
              'CG-05': 'PASS',
              'CG-06': 'PASS',
              'CG-07': 'READY',
              'CG-08': 'READY',
              'CG-09': 'READY',
              'CG-10': 'READY',
          }
          gates = {row['gate']: row['status'] for row in report['gates']}
          if gates != expected_gates:
              raise SystemExit(f'unexpected gate state: {gates}')
          interior = report['cg06_interior_controls']
          if interior.get('status') != 'PASS':
              raise SystemExit('CG-06 interior controls did not pass')
          if interior.get('input_mode') != 'OFFICIAL_POLYGON_COORDINATE_ONLY':
              raise SystemExit('CG-06 input mode changed')
          if interior.get('geocoder_used') is not False or interior.get('address_input_used') is not False:
              raise SystemExit('CG-06 used an address or geocoder')
          if interior.get('feature_count') != 4 or interior.get('keys_covered') != ['1', '2', '3', '4']:
              raise SystemExit('CG-06 did not prove all four live precinct polygons')
          if interior.get('families') != ['commissioner', 'justice_of_the_peace', 'constable']:
              raise SystemExit('CG-06 district-family contract changed')
          controls = interior.get('controls') or []
          if len(controls) != 4 or interior.get('control_count') != 4:
              raise SystemExit('CG-06 must retain four interior controls')
          if interior.get('canonical_join_count') != 12:
              raise SystemExit('CG-06 must prove 12 district-office joins')
          if interior.get('normal_applicable_offices') != 9 or interior.get('normal_composition') != {'countywide': 6, 'district': 3}:
              raise SystemExit('CG-06 applicable-office composition changed')
          for row in controls:
              key = row['district_key']
              if row.get('status') != 'PASS' or row.get('live_matches') != [key]:
                  raise SystemExit(f'CG-06 control {row.get("id")} did not resolve exactly')
              if row.get('local_polygon_contains_point') is not True:
                  raise SystemExit(f'CG-06 control {row.get("id")} is not locally interior')
              if row.get('boundary_clearance_degrees', 0) < 0.01:
                  raise SystemExit(f'CG-06 control {row.get("id")} is too close to a boundary')
              if len(row.get('canonical_joins') or []) != 3 or row.get('applicable_offices') != 9:
                  raise SystemExit(f'CG-06 control {row.get("id")} canonical join changed')
          if report.get('candidate_spec_sha256') != '20dad659a7bb3b9cfcd8ec5979827eed328aeb346bd42287dce2a6247b655fe2':
              raise SystemExit('frozen candidate SHA changed')
          if report.get('proof_spec_sha256') != '46cdf29a9164377dec9720a5587e03d8106a5e281fa5c7f004b6d9b3a27e0bf8':
              raise SystemExit('CG-06 proof-spec SHA changed')
          if report.get('stopped_before') != 'CG-07' or report.get('packaged') is not False:
              raise SystemExit('CG-06 crossed the CG-07/package boundary')
          if report.get('actions') != 'NOT_YET_RELEASED' or report.get('production_runtime_changed') is not False:
              raise SystemExit('CG-06 crossed the action or production boundary')
          print(json.dumps({
              'status': 'PASS',
              'gate': 'CG-06',
              'controls': len(controls),
              'district_keys': interior['keys_covered'],
              'canonical_joins': interior['canonical_join_count'],
              'geocoder_used': interior['geocoder_used'],
              'evidence_sha256': hashlib.sha256(left_bytes).hexdigest(),
              'next_gate': 'CG-07',
          }, sort_keys=True))
          PY

      - name: Upload County #13 CG-06 evidence
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-lubbock-county13-cg06-${{ github.run_id }}
          path: artifacts/civic-gps-lubbock-cg06-a/
          if-no-files-found: error
          retention-days: 30

  outside-negative-proof:
    name: Lubbock County CG-07 coordinate-only outside-negative proof
    needs: interior-control-proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out County #13 branch
