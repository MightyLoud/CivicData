name: EV-IMP-019 Hawaiʻi package probe

on:
  push:
    branches:
      - agent/ev-imp-019-hi-4-routing-candidate

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe governed Hawaiʻi office geography
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.ev_onboarding_proposal import discover_package

          ids = [
              'jurisdiction-hi-hawaii-county',
              'jurisdiction-hi-honolulu-county',
              'jurisdiction-hi-kauai-county',
              'jurisdiction-hi-maui-county',
              'jurisdiction-hi-kalawao-county',
          ]
          root = Path('.').resolve()
          rows = []
          for jid in ids:
              package, _ = discover_package(root, jid)
              offices = []
              for row in package.get('records', {}).get('offices', []):
                  offices.append({
                      k: row.get(k) for k in (
                          'office_id','name','office_name','classification_or_role','role',
                          'represented_division_id','geography_id','division_id','seats','seat_count',
                          'selection_method','election_scope'
                      ) if k in row
                  })
              rows.append({
                  'package_jurisdiction_id': jid,
                  'jurisdiction_division_id': package.get('jurisdiction', {}).get('division_id'),
                  'divisions': [
                      {'division_id': d.get('division_id'), 'division_type': d.get('division_type'), 'name': d.get('name')}
                      for d in package.get('records', {}).get('divisions', [])
                  ],
                  'offices': offices,
              })
          print('EV_IMP_019_OFFICE_PROBE=' + json.dumps(rows, sort_keys=True, separators=(',', ':')))
          PY
