name: 'Civic GPS Smith County CG-09 candidate gate'

on:
  workflow_dispatch:
  push:
    branches:
      - 'agent/civic-gps-smith-onboarding'
    paths:
      - '.github/workflows/civic-gps-smith-cg09.yml'
      - 'tools/civic_gps_package_smith_candidate.py'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tests/civic_gps_smith_live_probe.py'
      - 'tests/civic_gps_live_smoke.py'
      - 'tests/civic_gps_denton_live_probe.py'
      - 'tests/civic_gps_denton_negative_probe.py'
      - 'tests/civic_gps_denton_boundary_probe.py'
      - 'tests/civic_gps_denton_action_probe.py'
      - 'tests/civic_gps_collin_live_probe.py'
      - 'tests/civic_gps_travis_live_probe.py'
      - 'tests/civic_gps_williamson_live_probe.py'
      - 'tests/civic_gps_tarrant_live_probe.py'
      - 'tests/civic_gps_bastrop_live_probe.py'
      - 'tests/civic_gps_brazos_live_probe.py'
      - 'tests/civic_gps_county_onboarding_test.py'
      - 'tests/civic_gps_topology_probe_test.py'
      - 'tests/fixtures/civic_gps_county_onboarding/**'
      - 'civic_gps_runtime_parts/part.*'
      - 'requirements-civic-gps.txt'

permissions:
  contents: read

concurrency:
  group: civic-gps-smith-cg09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smith-cg09:
    name: Smith deterministic package and full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SMITH_BASE_RUNTIME_SHA256: 'bc40a0aa46fcdbd5b2c73976747ef702d9a64fd051832c615ba4aba1016a7427'
      SMITH_CANDIDATE_RUNTIME_SHA256: '49b54af31cb4687936a2dddb6a91f6305aa7b4977756a3db203562971296a23a'
      CIVIC_GPS_EXPECTED_REGISTRY_VERSION: '0.5.9'
      CIVIC_GPS_EXPECTED_RUNTIME_SHA256: '49b54af31cb4687936a2dddb6a91f6305aa7b4977756a3db203562971296a23a'
    steps:
      - name: Check out Smith County branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-civic-gps.txt

      - name: Install Civic GPS runtime dependency
        run: python -m pip install -r requirements-civic-gps.txt

      - name: Compile candidate packager and complete regression matrix
        run: >-
          python -m py_compile
          tools/civic_gps_package_smith_candidate.py
          tools/civic_gps_county_onboarding.py
          tools/civic_gps_tx_county_archetype.py
          tests/civic_gps_county_onboarding_test.py
          tests/civic_gps_topology_probe_test.py
          tests/civic_gps_live_smoke.py
          tests/civic_gps_denton_live_probe.py
          tests/civic_gps_denton_negative_probe.py
          tests/civic_gps_denton_boundary_probe.py
          tests/civic_gps_denton_action_probe.py
          tests/civic_gps_collin_live_probe.py
          tests/civic_gps_travis_live_probe.py
          tests/civic_gps_williamson_live_probe.py
          tests/civic_gps_tarrant_live_probe.py
          tests/civic_gps_bastrop_live_probe.py
          tests/civic_gps_brazos_live_probe.py
          tests/civic_gps_smith_live_probe.py

      - name: Build Smith candidate package twice
        shell: bash
        run: |
          python tools/civic_gps_package_smith_candidate.py --output-dir artifacts/civic-gps-smith-cg09-package-a
          python tools/civic_gps_package_smith_candidate.py --output-dir artifacts/civic-gps-smith-cg09-package-b

      - name: Prove deterministic candidate package and exact scope
        shell: bash
        run: |
          diff -qr artifacts/civic-gps-smith-cg09-package-a artifacts/civic-gps-smith-cg09-package-b
          echo "$SMITH_CANDIDATE_RUNTIME_SHA256  artifacts/civic-gps-smith-cg09-package-a/civic_gps_smith_candidate_runtime.zip" | sha256sum --check --strict
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile

          package = Path('artifacts/civic-gps-smith-cg09-package-a')
          manifest = json.loads((package / 'smith-candidate-package-manifest.json').read_text())
          expected = {
              'status': 'PASS',
              'gate': 'CG-09',
              'next_gate': 'CG-10',
              'stopped_before': 'CG-10',
              'engine_version': '0.6.2',
              'base_registry_artifact_version': '0.5.8',
              'candidate_registry_artifact_version': '0.5.9',
              'base_runtime_sha256': 'bc40a0aa46fcdbd5b2c73976747ef702d9a64fd051832c615ba4aba1016a7427',
              'candidate_runtime_sha256': '49b54af31cb4687936a2dddb6a91f6305aa7b4977756a3db203562971296a23a',
              'package_entry_count': 20,
              'bundle_count': 12,
              'release_offices': 20,
              'release_holders': 20,
              'actions': 'NOT_YET_RELEASED',
              'candidate_packaged': True,
              'production_runtime_changed': False,
          }
          actual = {key: manifest.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'unexpected Smith candidate manifest: {actual} != {expected}')
          if manifest.get('smith_action_registry_files') != []:
              raise SystemExit('Smith action routing was unexpectedly packaged')

          runtime_path = package / 'civic_gps_smith_candidate_runtime.zip'
          if hashlib.sha256(runtime_path.read_bytes()).hexdigest() != manifest['candidate_runtime_sha256']:
              raise SystemExit('candidate runtime bytes do not match the manifest')
          with ZipFile(runtime_path) as archive:
              names = sorted(archive.namelist())
              if names != manifest['package_entries']:
                  raise SystemExit('candidate ZIP entries do not match the manifest')
              registry = json.loads(archive.read('civic_gps/registry.json'))
              smith = [row for row in registry['bundles'] if row.get('adapter_id') == 'ADAPTER-TX-SMITH']
              if registry.get('registry_artifact_version') != '0.5.9' or len(smith) != 1:
                  raise SystemExit('candidate registry does not contain exactly one Smith bundle at v0.5.9')
              if any(row.get('source_status') != 'LIVE_INTERIOR_NEGATIVE_BOUNDARY_PASS' for row in smith[0]['district_adapters']):
                  raise SystemExit('Smith candidate adapter proof status changed')
          print(json.dumps(actual, sort_keys=True))
          PY

      - name: Install isolated Smith candidate runtime
        shell: bash
        run: |
          unzip -q artifacts/civic-gps-smith-cg09-package-a/civic_gps_smith_candidate_runtime.zip
          find civic_gps_runtime_parts -maxdepth 1 -type f -name 'part.*' -delete
          split -b 8000 -d -a 2 artifacts/civic-gps-smith-cg09-package-a/civic_gps_smith_candidate_runtime.zip civic_gps_runtime_parts/part.
          cat civic_gps_runtime_parts/part.* > artifacts/civic-gps-smith-cg09-reconstructed.zip
          echo "$SMITH_CANDIDATE_RUNTIME_SHA256  artifacts/civic-gps-smith-cg09-reconstructed.zip" | sha256sum --check --strict
          test "$(python -c "import json; print(json.load(open('civic_gps/registry.json'))['registry_artifact_version'])")" = '0.5.9'

      - name: Run deterministic County Onboarding Pipeline fixtures
        shell: bash
        run: |
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/williamson_supported_v0.1.json --output-dir artifacts/civic-gps-county-onboarding/williamson --expect SUPPORTED_V0_1
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/hays_multi_office_stop_v0.1.json --output-dir artifacts/civic-gps-county-onboarding/hays --expect MULTI_OFFICE_PER_DISTRICT
          python tests/civic_gps_county_onboarding_test.py
          python tests/civic_gps_topology_probe_test.py

      - name: Run baseline real-network Civic GPS controls
        run: python tests/civic_gps_live_smoke.py

      - name: Run packaged Denton live controls
        run: python tests/civic_gps_denton_live_probe.py

      - name: Run packaged Denton outside-county negative control
        run: python tests/civic_gps_denton_negative_probe.py

      - name: Run packaged Denton boundary fail-closed controls
        run: python tests/civic_gps_denton_boundary_probe.py

      - name: Run Denton action selection contract
        run: python tests/civic_gps_denton_action_probe.py

      - name: Run packaged Collin County regression
        run: python tests/civic_gps_collin_live_probe.py

      - name: Run packaged Travis County regression
        run: python tests/civic_gps_travis_live_probe.py

      - name: Run packaged Williamson County regression
        run: python tests/civic_gps_williamson_live_probe.py

      - name: Run packaged Tarrant County regression
        run: python tests/civic_gps_tarrant_live_probe.py

      - name: Run packaged Bastrop County regression
        run: python tests/civic_gps_bastrop_live_probe.py

      - name: Run packaged Brazos County regression
        run: python tests/civic_gps_brazos_live_probe.py

      - name: Run packaged Smith County proof twice
        shell: bash
        run: |
          python tests/civic_gps_smith_live_probe.py --packaged --expected-runtime-sha256 "$SMITH_CANDIDATE_RUNTIME_SHA256" --output-dir artifacts/civic-gps-smith-cg09-a
          python tests/civic_gps_smith_live_probe.py --packaged --expected-runtime-sha256 "$SMITH_CANDIDATE_RUNTIME_SHA256" --output-dir artifacts/civic-gps-smith-cg09-b

      - name: Prove deterministic Smith result and close CG-09 only
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          left_path = Path('artifacts/civic-gps-smith-cg09-a/smith-cg09-summary.json')
          right_path = Path('artifacts/civic-gps-smith-cg09-b/smith-cg09-summary.json')
          left_bytes = left_path.read_bytes()
          right_bytes = right_path.read_bytes()
          if left_bytes != right_bytes:
              raise SystemExit('Smith CG-09 summaries are not deterministic')
          summary = json.loads(left_bytes)
          expected = {
              'status': 'PASS',
              'gates': {'CG-09': 'PASS'},
              'engine_version': '0.6.2',
              'registry_artifact_version': '0.5.9',
              'runtime_sha256': '49b54af31cb4687936a2dddb6a91f6305aa7b4977756a3db203562971296a23a',
              'base_runtime_sha256': 'bc40a0aa46fcdbd5b2c73976747ef702d9a64fd051832c615ba4aba1016a7427',
              'candidate_runtime_sha256': '49b54af31cb4687936a2dddb6a91f6305aa7b4977756a3db203562971296a23a',
              'production_runtime_changed': False,
              'candidate_packaged': True,
              'actions': 'NOT_YET_RELEASED',
              'next_gate': 'CG-10',
              'stopped_before': 'CG-10',
          }
          actual = {key: summary.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'unexpected Smith CG-09 result: {actual} != {expected}')
          if len(summary.get('interior_controls') or []) != 5:
              raise SystemExit('Smith CG-09 must retain five interior controls')
          if summary.get('outside_negative', {}).get('smith_leakage') != 0:
              raise SystemExit('Smith CG-09 outside-negative leaked county output')
          boundaries = summary.get('boundaries') or {}
          if boundaries.get('commissioner_only', {}).get('exact_applicable_offices') != 8:
              raise SystemExit('Commissioner-only boundary did not preserve eight Smith offices')
          if boundaries.get('jp_constable_only', {}).get('exact_applicable_offices') != 7:
              raise SystemExit('JP/Constable-only boundary did not preserve seven Smith offices')

          matrix = {
              'status': 'PASS',
              'gate': 'CG-09',
              'candidate_runtime_sha256': summary['candidate_runtime_sha256'],
              'candidate_registry_artifact_version': summary['registry_artifact_version'],
              'smith_summary_sha256': hashlib.sha256(left_bytes).hexdigest(),
              'smith_live_proof_runs': 2,
              'full_regression_matrix': [
                  'county-onboarding-fixtures',
                  'topology-probe',
                  'baseline-live-smoke',
                  'denton-live-negative-boundary-action',
                  'collin-live-negative-boundary',
                  'travis-live-negative-boundary',
                  'williamson-live-negative-boundary',
                  'tarrant-live-negative-boundary',
                  'bastrop-live-negative-boundary',
                  'brazos-live-negative-boundary',
                  'smith-live-negative-independent-boundaries-twice',
              ],
              'production_runtime_changed': False,
              'actions': 'NOT_YET_RELEASED',
              'next_gate': 'CG-10',
          }
          path = Path('artifacts/civic-gps-smith-cg09-regression-summary.json')
          path.write_text(json.dumps(matrix, sort_keys=True, indent=2) + '\n')
          print(json.dumps(matrix, sort_keys=True))
          PY

      - name: Upload Smith CG-09 package and regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-smith-county9-cg09-${{ github.run_id }}
          path: |
            artifacts/civic-gps-smith-cg09-package-a/
            artifacts/civic-gps-smith-cg09-package-b/smith-candidate-package-manifest.json
            artifacts/civic-gps-smith-cg09-a/
            artifacts/civic-gps-smith-cg09-b/smith-cg09-summary.json
            artifacts/civic-gps-smith-cg09-regression-summary.json
            artifacts/civic-gps-county-onboarding/
            artifacts/civic-gps-live-smoke/
            artifacts/civic-gps-travis-archetype/
            artifacts/civic-gps-williamson-cg09/
            artifacts/civic-gps-tarrant-cg09/
            artifacts/civic-gps-bastrop-cg09/
            artifacts/civic-gps-brazos-cg09/
          if-no-files-found: error
          retention-days: 30
