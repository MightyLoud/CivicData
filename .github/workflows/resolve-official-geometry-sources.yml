name: Resolve official district geometry sources

on:
  pull_request:
    paths:
      - "tools/resolve_official_geometry_sources.py"
      - ".github/workflows/resolve-official-geometry-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query public ArcGIS APIs and generate snapshots
        run: python tools/resolve_official_geometry_sources.py
      - name: Commit governed geometry snapshots to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- data/reference/co/geometry; then
            echo "No geometry snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference/co/geometry
          git commit -m "Archive official Alamosa and Arvada district geometry snapshots"
          git push origin "HEAD:${{ github.head_ref }}"
