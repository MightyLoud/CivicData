name: Civic GPS Williamson CG-09 packaged regression

on:
  push:
    branches:
      - 'agent/civic-gps-williamson-cg09'
    paths:
      - 'civic_gps_runtime_parts/**'
      - 'tests/civic_gps_williamson_live_probe.py'
      - 'tests/civic_gps_denton_live_probe.py'
      - 'tests/civic_gps_denton_action_probe.py'
      - 'tests/civic_gps_collin_live_probe.py'
      - 'tests/civic_gps_travis_live_probe.py'
      - '.github/workflows/civic-gps-williamson-cg09-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Williamson CG-09 package + full regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out CG-09 package candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-civic-gps.txt
      - name: Install Civic GPS runtime dependency
        run: python -m pip install -r requirements-civic-gps.txt
      - name: Reconstruct exact v0.5.4 runtime package
        shell: bash
        run: |
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo '52e60a83b42c65cd03bf81c3169c54c86d8c7750686d5d827838ec636b4e26de  civic_gps_runtime.zip' | sha256sum --check --strict
          unzip -q civic_gps_runtime.zip
      - name: Compile engine and packaged regression tests
        run: python -m py_compile civic_gps/engine.py tests/civic_gps_live_smoke.py tests/civic_gps_denton_live_probe.py tests/civic_gps_denton_negative_probe.py tests/civic_gps_denton_boundary_probe.py tests/civic_gps_denton_action_probe.py tests/civic_gps_collin_live_probe.py tests/civic_gps_travis_live_probe.py tests/civic_gps_williamson_live_probe.py
      - name: Run baseline real-network Civic GPS controls
        run: python tests/civic_gps_live_smoke.py
      - name: Run packaged Denton live controls
        run: python tests/civic_gps_denton_live_probe.py
      - name: Run packaged Denton outside-county negative control
        run: python tests/civic_gps_denton_negative_probe.py
      - name: Run packaged Denton boundary fail-closed controls
        run: python tests/civic_gps_denton_boundary_probe.py
      - name: Run Denton action selection contract
        run: python tests/civic_gps_denton_action_probe.py
      - name: Run packaged Collin County archetype controls
        run: python tests/civic_gps_collin_live_probe.py
      - name: Run packaged Travis County archetype controls
        run: python tests/civic_gps_travis_live_probe.py
      - name: Run packaged Williamson County controls
        run: python tests/civic_gps_williamson_live_probe.py
      - name: Upload CG-09 regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-williamson-cg09-regression-${{ github.run_id }}
          path: |
            artifacts/civic-gps-live-smoke/
            artifacts/civic-gps-williamson-cg09/
            artifacts/civic-gps-travis-archetype/
          if-no-files-found: warn
          retention-days: 30
