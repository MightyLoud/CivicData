name: Texas production deployment validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'civic_gps_runtime_parts/**'
      - 'civic_gps_extensions/**'
      - 'consumers/empowered_vote/package_catalog.py'
      - 'consumers/empowered_vote/production_profile.py'
      - 'consumers/empowered_vote/representation.py'
      - 'consumers/empowered_vote/representation_catalog.py'
      - 'data/packages/tx/legislative/**'
      - 'tools/texas_production_deployment_validation.py'
      - 'tests/test_texas_production_deployment_validation.py'
      - 'tests/test_tx_successor_package.py'
      - 'docs/workflows/texas-production-deployment-validation-v0.1.md'
      - '.github/workflows/texas-production-deployment-validation.yml'
  push:
    branches:
      - 'agent/day12-tx-integration'
    paths:
      - 'civic_gps_runtime_parts/**'
      - 'civic_gps_extensions/**'
      - 'consumers/empowered_vote/package_catalog.py'
      - 'consumers/empowered_vote/production_profile.py'
      - 'consumers/empowered_vote/representation.py'
      - 'consumers/empowered_vote/representation_catalog.py'
      - 'data/packages/tx/legislative/**'
      - 'tools/texas_production_deployment_validation.py'
      - 'tests/test_texas_production_deployment_validation.py'
      - 'tests/test_tx_successor_package.py'
      - 'docs/workflows/texas-production-deployment-validation-v0.1.md'
      - '.github/workflows/texas-production-deployment-validation.yml'

permissions:
  contents: read

concurrency:
  group: texas-production-deployment-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Texas production deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CIVIC_GPS_EXPECTED_RUNTIME_SHA256: '1969e0e6760bdf4e479bd01fa6976f2ea25dd5fdc14e53d0f4b861cde97549ba'
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-civic-gps.txt

      - name: Install Civic GPS runtime dependency
        run: python -m pip install -r requirements-civic-gps.txt

      - name: Reconstruct exact Civic GPS runtime
        shell: bash
        run: |
          set -euo pipefail
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo "$CIVIC_GPS_EXPECTED_RUNTIME_SHA256  civic_gps_runtime.zip" | sha256sum --check --strict
          rm -rf civic_gps
          unzip -q civic_gps_runtime.zip

      - name: Compile deployment validator
        run: python -m py_compile tools/texas_production_deployment_validation.py tests/test_texas_production_deployment_validation.py

      - name: Run offline fail-closed disposition controls
        run: python tests/test_texas_production_deployment_validation.py

      - name: Recheck committed successor package
        run: python tests/test_tx_successor_package.py

      - name: Execute exact-head live candidate validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/texas-production-deployment
          python tools/texas_production_deployment_validation.py \
            --repo-root . \
            --head-sha "$GITHUB_SHA" \
            --observed-on "$(date -u +%F)" \
            --output artifacts/texas-production-deployment/deployment-validation-v0.1.json

      - name: Show governed disposition
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/texas-production-deployment/deployment-validation-v0.1.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          path = Path('artifacts/texas-production-deployment/deployment-validation-v0.1.json')
          report = json.loads(path.read_text())
          print('status=' + report['status'])
          print('head_sha=' + report['head_sha'])
          for row in report['checks']:
              print(row['check_id'] + '=' + row['status'])
          print('activation_authorized=' + str(report['activation_authorized']).lower())
          print('repository_activation=' + report['repository_activation'])
          print('deterministic_sha256=' + report['deterministic_sha256'])
          PY
          fi

      - name: Upload exact-head deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: texas-production-deployment-validation-${{ github.sha }}
          path: artifacts/texas-production-deployment/deployment-validation-v0.1.json
          if-no-files-found: error
          retention-days: 30
