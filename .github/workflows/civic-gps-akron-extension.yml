name: EV-IMP-005 Akron Civic GPS extension

on:
  pull_request:
    branches:
      - main
    paths:
      - "civic_gps_extensions/**"
      - "tests/civic_gps_akron_extension_live_probe.py"
      - "consumers/empowered_vote/representation.py"
      - "consumers/empowered_vote/representation_catalog.py"
      - "consumers/empowered_vote/package_catalog.v0.1.json"
      - "data/packages/co/akron/**"
      - ".github/workflows/civic-gps-akron-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  akron-live:
    name: Akron live geography → governed package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Civic GPS runtime dependency
        run: python -m pip install -r requirements-civic-gps.txt
      - name: Reconstruct exact Civic GPS runtime
        shell: bash
        run: |
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo 'a1d323db8ed7eaaa47e3541a42bacef4377e9c41161f7a2ad888ddf86e5fe192  civic_gps_runtime.zip' | sha256sum --check --strict
          unzip -q civic_gps_runtime.zip
      - name: Compile Akron extension and consumer
        run: python -m py_compile civic_gps_extensions/loader.py consumers/empowered_vote/representation.py consumers/empowered_vote/representation_catalog.py tests/civic_gps_akron_extension_live_probe.py
      - name: Run real-network Akron controls
        run: python tests/civic_gps_akron_extension_live_probe.py
