name: Governed address lookup CLI

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/governed_address_lookup.py"
      - "tests/test_governed_address_lookup.py"
      - "tests/test_address_geocoding_runtime.py"
      - "tests/governed_district_controls.py"
      - "docs/governed-address-lookup-cli-v0.1.md"
      - "consumers/empowered_vote/**"
      - "adapters/factory/**"
      - "adapters/shared_identity.py"
      - "tools/shared_identity_registry.py"
      - "tools/geocoding_boundary.py"
      - "tools/governed_geography_resolver.py"
      - "tools/geometry_governance.py"
      - "tools/jurisdiction_package.py"
      - "data/normalized/co/**"
      - "data/reference/co/**"
      - ".github/workflows/governed-address-lookup.yml"
  push:
    branches: [main]
    paths:
      - "tools/governed_address_lookup.py"
      - "tests/test_governed_address_lookup.py"
      - "tests/test_address_geocoding_runtime.py"
      - "tests/governed_district_controls.py"
      - "docs/governed-address-lookup-cli-v0.1.md"
      - "consumers/empowered_vote/**"
      - "adapters/factory/**"
      - "adapters/shared_identity.py"
      - "tools/shared_identity_registry.py"
      - "tools/geocoding_boundary.py"
      - "tools/governed_geography_resolver.py"
      - "tools/geometry_governance.py"
      - "tools/jurisdiction_package.py"
      - "data/normalized/co/**"
      - "data/reference/co/**"
      - ".github/workflows/governed-address-lookup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline command and existing address runtime regressions
        run: python -m unittest -v tests.test_governed_address_lookup tests.test_address_geocoding_runtime
