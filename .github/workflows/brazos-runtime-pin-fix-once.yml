name: Fix Brazos runtime test pin once

on:
  push:
    branches:
      - agent/brazos-actions-remediation
    paths:
      - '.github/workflows/brazos-runtime-pin-fix-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/brazos-actions-remediation
          fetch-depth: 0
      - name: Update active legislative runtime integrity pin
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/civic_gps_legislative_overlay_test.py')
          text = path.read_text(encoding='utf-8')
          old = '1969e0e6760bdf4e479bd01fa6976f2ea25dd5fdc14e53d0f4b861cde97549ba'
          new = 'a1d323db8ed7eaaa47e3541a42bacef4377e9c41161f7a2ad888ddf86e5fe192'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one active legislative runtime pin, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/civic_gps_legislative_overlay_test.py
          git commit -m 'Update legislative runtime integrity pin for Brazos 0.6.3'
          git push origin HEAD:agent/brazos-actions-remediation
