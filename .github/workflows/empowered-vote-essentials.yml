name: Empowered.Vote Essentials consumer

on:
  pull_request:
    paths:
      - "consumers/empowered_vote/**"
      - "tools/ev_jurisdiction_onboarding.py"
      - "tools/ev_onboarding_batch.py"
      - "onboarding/ev/**"
      - "tests/empowered_vote_essentials_test.py"
      - "tests/empowered_vote_package_source_test.py"
      - "tests/empowered_vote_live_civic_gps_test.py"
      - "tests/empowered_vote_live_civic_gps_network_test.py"
      - "tests/empowered_vote_package_catalog_test.py"
      - "tests/empowered_vote_second_jurisdiction_test.py"
      - "tests/empowered_vote_third_jurisdiction_test.py"
      - "tests/civic_gps_fircrest_extension_live_probe.py"
      - "tests/ev_jurisdiction_onboarding_test.py"
      - "tests/ev_onboarding_batch_test.py"
      - "docs/empowered-vote-imp-001.md"
      - "docs/empowered-vote-imp-002.md"
      - "docs/empowered-vote-imp-003.md"
      - "docs/empowered-vote-imp-004.md"
      - "docs/empowered-vote-imp-005.md"
      - "docs/empowered-vote-imp-006.md"
      - "docs/empowered-vote-imp-007.md"
      - "docs/empowered-vote-imp-008.md"
      - "docs/ev-imp-001-acceptance.json"
      - "data/packages/wa/tacoma/**"
      - "data/reference/wa/tacoma/**"
      - "data/packages/co/akron/**"
      - "data/packages/wa/fircrest/**"
      - "data/reference/wa/fircrest/**"
      - "civic_gps_extensions/**"
      - ".github/workflows/empowered-vote-essentials.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ev-imp-001:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Empowered.Vote consumers and onboarding pipeline
        run: python -m py_compile consumers/empowered_vote/adapter.py consumers/empowered_vote/render.py consumers/empowered_vote/package_source.py consumers/empowered_vote/live_civic_gps.py consumers/empowered_vote/package_catalog.py consumers/empowered_vote/representation.py consumers/empowered_vote/representation_catalog.py consumers/empowered_vote/full_essentials_catalog.py tools/ev_jurisdiction_onboarding.py tools/ev_onboarding_batch.py tests/empowered_vote_essentials_test.py tests/empowered_vote_package_source_test.py tests/empowered_vote_live_civic_gps_test.py tests/empowered_vote_live_civic_gps_network_test.py tests/empowered_vote_package_catalog_test.py tests/empowered_vote_second_jurisdiction_test.py tests/empowered_vote_third_jurisdiction_test.py tests/ev_jurisdiction_onboarding_test.py tests/ev_onboarding_batch_test.py
      - name: Run frozen-payload consumer tests
        run: python tests/empowered_vote_essentials_test.py
      - name: Run governed-package boundary and Tacoma package tests
        run: python tests/empowered_vote_package_source_test.py
      - name: Run live Civic GPS geography bridge unit tests
        run: python tests/empowered_vote_live_civic_gps_test.py
      - name: Run governed package catalog tests
        run: python tests/empowered_vote_package_catalog_test.py
      - name: Run second real jurisdiction representation tests
        run: python tests/empowered_vote_second_jurisdiction_test.py
      - name: Run repeatable onboarding pipeline tests
        run: python tests/ev_jurisdiction_onboarding_test.py
      - name: Replay Akron onboarding spec against governed artifacts
        run: python tools/ev_jurisdiction_onboarding.py onboarding/ev/akron.v0.1.json --repo-root . --output artifacts/ev-imp-006/akron --verify-current
      - name: Run third real jurisdiction Full Essentials tests
        run: python tests/empowered_vote_third_jurisdiction_test.py
      - name: Replay Fircrest onboarding spec against governed artifacts
        run: python tools/ev_jurisdiction_onboarding.py onboarding/ev/fircrest.v0.1.json --repo-root . --output artifacts/ev-imp-007/fircrest --verify-current
      - name: Run catalog-wide onboarding batch tests
        run: python tests/ev_onboarding_batch_test.py
      - name: Replay every production onboarding spec
        run: python tools/ev_onboarding_batch.py --repo-root . --output artifacts/ev-imp-008
