name: 'Civic GPS Johnson County #11 onboarding'

on:
  push:
    branches:
      - 'agent/civic-gps-johnson-intake'
    paths:
      - '.github/workflows/civic-gps-johnson-county11-onboarding.yml'
      - 'tests/fixtures/civic_gps_county_onboarding/johnson_county11_candidate_v0.1.json'
      - 'tools/civic_gps_county_onboarding.py'
      - 'tools/civic_gps_tx_county_archetype.py'
      - 'tests/civic_gps_johnson_roster_probe.py'
      - 'civic_gps_runtime_parts/part.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit-screen:
    name: Johnson County automated CG-01 to CG-04
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Check out County #11 branch'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile onboarding and roster-proof tooling
        run: python -m py_compile tools/civic_gps_county_onboarding.py tools/civic_gps_tx_county_archetype.py tests/civic_gps_johnson_roster_probe.py

      - name: Run frozen Johnson spec twice
        shell: bash
        run: |
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/johnson_county11_candidate_v0.1.json --output-dir artifacts/civic-gps-johnson-county11-a --expect SUPPORTED_V0_1
          python tools/civic_gps_county_onboarding.py tests/fixtures/civic_gps_county_onboarding/johnson_county11_candidate_v0.1.json --output-dir artifacts/civic-gps-johnson-county11-b --expect SUPPORTED_V0_1

      - name: Prove deterministic outputs and exact supported result
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          a = Path('artifacts/civic-gps-johnson-county11-a')
          b = Path('artifacts/civic-gps-johnson-county11-b')

          def snapshot(root):
              return {
                  str(path.relative_to(root)): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in sorted(root.rglob('*'))
                  if path.is_file()
              }

          left, right = snapshot(a), snapshot(b)
          if left != right:
              raise SystemExit(f'non-deterministic outputs: {left} != {right}')

          expected_files = {
              'base-bundle-plan.json',
              'builder-spec.json',
              'canonical-release-preview.json',
              'fit-report.json',
              'manifest.json',
              'proof-plan.json',
              'source-precedence.json',
          }
          if set(left) != expected_files:
              raise SystemExit(f'unexpected evidence files: {sorted(left)}')

          report = json.loads((a / 'fit-report.json').read_text())
          expected = {
              'decision': 'GO',
              'result': 'SUPPORTED_V0_1',
              'stop_class': 'NONE',
              'stop_classes': [],
              'stop_reasons': {},
              'tracker_fit_result': 'SUPPORTED_V0_1',
              'architecture_change': 'NO',
          }
          actual = {key: report.get(key) for key in expected}
          if actual != expected:
              raise SystemExit(f'unexpected fit result: {actual} != {expected}')

          proof = json.loads((a / 'proof-plan.json').read_text())
          gates = {row['gate']: row['status'] for row in proof['gates']}
          expected_gates = {
              'CG-01': 'PASS',
              'CG-02': 'PASS',
              'CG-03': 'PASS',
              'CG-04': 'READY',
              'CG-05': 'READY',
              'CG-06': 'READY',
              'CG-07': 'READY',
              'CG-08': 'READY',
              'CG-09': 'READY',
              'CG-10': 'READY',
          }
          if gates != expected_gates:
              raise SystemExit(f'unexpected gate state: {gates} != {expected_gates}')

          release = json.loads((a / 'canonical-release-preview.json').read_text())
          offices = release['payload']['offices']
          holders = release['payload']['officeholders']
          office_ids = [row['office_id'] for row in offices]
          holder_office_ids = [row['office_id'] for row in holders]
          if len(offices) != 18 or len(holders) != 18:
              raise SystemExit(f'expected 18 offices/holders, got {len(offices)}/{len(holders)}')
          if len(set(office_ids)) != 18 or set(holder_office_ids) != set(office_ids):
              raise SystemExit('canonical office/holder joins are not unique and complete')

          bundle = json.loads((a / 'base-bundle-plan.json').read_text())
          adapters = bundle['district_adapters']
          if len(adapters) != 3:
              raise SystemExit(f'expected three district adapters, got {len(adapters)}')
          if any(row['failure_scope'] != 'ADAPTER' for row in adapters):
              raise SystemExit('adapter failure scope changed')
          if any(row['officeholder_identity_source'] != 'CANONICAL_RELEASE_ONLY' for row in adapters):
              raise SystemExit('adapter identity-source contract changed')
          if any(row['boundary_policy'] != 'MULTIPLE_INTERSECTIONS => CONFLICT; NEVER TIE_BREAK' for row in adapters):
              raise SystemExit('boundary policy changed')
          if {row['district_field'] for row in adapters} != {'ID'}:
              raise SystemExit('district-field contract changed')
          if any(row['district_key_normalization'] != 'NUMERIC' for row in adapters):
              raise SystemExit('numeric district-key contract changed')

          precedence = json.loads((a / 'source-precedence.json').read_text())
          if precedence.get('status') != 'RESOLVED' or len(precedence.get('records', [])) != 2:
              raise SystemExit(f'unexpected source precedence: {precedence}')

          print(json.dumps({
              'status': 'PASS',
              'decision': report['decision'],
              'result': report['result'],
              'gates': gates,
              'office_count': len(offices),
              'holder_count': len(holders),
              'files': left,
          }, sort_keys=True))
          PY

      - name: Run Johnson CG-04 canonical-roster proof twice
        shell: bash
        run: |
          python tests/civic_gps_johnson_roster_probe.py --output-dir artifacts/civic-gps-johnson-cg04-a
          python tests/civic_gps_johnson_roster_probe.py --output-dir artifacts/civic-gps-johnson-cg04-b

      - name: Prove deterministic Johnson CG-04 result and stop before CG-05
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          left_path = Path('artifacts/civic-gps-johnson-cg04-a/johnson-cg04-summary.json')
          right_path = Path('artifacts/civic-gps-johnson-cg04-b/johnson-cg04-summary.json')
          left_bytes, right_bytes = left_path.read_bytes(), right_path.read_bytes()
          if left_bytes != right_bytes:
              raise SystemExit('Johnson CG-04 summary is not deterministic')

          summary = json.loads(left_bytes)
          if summary.get('status') != 'PASS' or summary.get('gates') != {'CG-04': 'PASS'}:
              raise SystemExit(f'unexpected CG-04 state: {summary}')
          if summary.get('next_gate') != 'CG-05' or summary.get('stopped_before') != 'CG-05':
              raise SystemExit(f'Johnson proof crossed the CG-05 boundary: {summary}')
          if summary.get('release_offices') != 18 or summary.get('release_holders') != 18:
              raise SystemExit('Johnson canonical release must contain 18 offices and 18 holders')
          if len(summary.get('source_checks') or []) != 18:
              raise SystemExit('Johnson CG-04 requires exactly 18 official-source roster checks')
          if any(row.get('status') != 'PASS' for row in summary['source_checks']):
              raise SystemExit('Johnson official-source roster verification is incomplete')
          if summary.get('source_precedence') != {'record_count': 2, 'status': 'RESOLVED'}:
              raise SystemExit('Johnson source-precedence proof changed')
          if summary.get('actions') != 'NOT_YET_RELEASED':
              raise SystemExit('Johnson action routing crossed its release boundary')
          if summary.get('scope') != 'BOUNDED_V0_1_SCOPE':
              raise SystemExit('Johnson bounded v0.1 scope changed')
          if summary.get('candidate_packaged') is not False or summary.get('production_runtime_changed') is not False:
              raise SystemExit('Johnson CG-04 may not package or change the production runtime')
          if summary.get('runtime_sha256') != '70354e50668e1f5950cd35145f06b2591a85b688e31dc9cb042b96b3493a802b':
              raise SystemExit(f'unexpected production runtime SHA: {summary.get("runtime_sha256")}')
          if summary.get('engine_version') != '0.6.2' or summary.get('registry_artifact_version') != '0.6.0':
              raise SystemExit('production engine/registry version changed')
          if summary.get('production_main_commit') != '0a87ca6ea479c62782d470e0283c455a2f0e0df0':
              raise SystemExit('recorded production-main commit changed')
          if summary.get('production_main_tree') != 'f87ee58616b0c50fbe274e0337442a0efe73c331':
              raise SystemExit('recorded production-main tree changed')
          contracts = summary.get('adapter_contracts') or {}
          if contracts.get('failure_scope') != 'ADAPTER':
              raise SystemExit('adapter failure scope changed')
          if contracts.get('officeholder_identity_source') != 'CANONICAL_RELEASE_ONLY':
              raise SystemExit('adapter identity-source contract changed')
          if contracts.get('boundary_policy') != 'MULTIPLE_INTERSECTIONS => CONFLICT; NEVER TIE_BREAK':
              raise SystemExit('boundary policy changed')
          print(json.dumps({
              'status': 'PASS',
              'gates': summary['gates'],
              'summary_sha256': hashlib.sha256(left_bytes).hexdigest(),
              'runtime_sha256': summary['runtime_sha256'],
              'next_gate': summary['next_gate'],
          }, sort_keys=True))
          PY

      - name: 'Upload County #11 CG-04 evidence'
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-johnson-county11-cg04-${{ github.run_id }}
          path: |
            artifacts/civic-gps-johnson-county11-a/
            artifacts/civic-gps-johnson-cg04-a/
            artifacts/civic-gps-johnson-cg04-b/johnson-cg04-summary.json
          if-no-files-found: error
          retention-days: 30
