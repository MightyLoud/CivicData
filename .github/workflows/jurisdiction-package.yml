      - "tests/test_governed_geography_resolver.py"
      - "tests/test_geocoding_boundary.py"
      - "tools/geocoding_boundary.py"
      - "consumers/empowered_vote/address_runtime.py"
      - "docs/governed-geocoding-boundary-v0.1.md"
      - "tools/governed_geography_resolver.py"
      - "tools/geometry_governance.py"
      - "schemas/governed_geometry_snapshot_v0.1.schema.json"
      - "data/reference/co/district_geometry_sources_v0.1.json"
      - "acceptance/geometry/**"
      - "docs/governed-district-geometry-v0.1.md"
      - "consumers/empowered_vote/runtime_conformance.py"
      - "consumers/empowered_vote/contract_v1.py"
      - "tools/export_representation.py"
      - "docs/representation-conformance-engine-v0.1.md"
      - "consumers/civicpatch/build_akron_upstream_handoff.py"
      - "acceptance/civicpatch/akron_upstream_base_69331c2.yml"
      - "candidates/civicpatch/akron_v0.1/upstream_handoff/**"
      - "consumers/civicpatch/reconcile.py"
      - "consumers/civicpatch/build_akron_partner_patch.py"
      - "candidates/civicpatch/akron_v0.1/**"
      - "acceptance/civicpatch/akron_identity_reconciliation_v0.1.json"
      - "consumers/civicpatch/**"
      - "acceptance/civicpatch/**"
      - "docs/contracts/factory-civicpatch-akron-pilot-v0.1.md"
      - "tools/canonical_representation_core.py"
      - "schemas/canonical_representation_core_v0.1.schema.json"
      - "acceptance/representation/canonical_core/**"
      - "docs/contracts/canonical-representation-core-v0.1.md"
      - "tools/assertion_governance.py"
      - "schemas/partner_assertion_v0.1.schema.json"
      - "acceptance/representation/partner_assertion_v0.1.json"
      - "docs/contracts/partner-assertion-governance-v0.1.md"
      - "tools/snapshot_manifest.py"
      - "schemas/interoperable_snapshot_manifest_v0.1.schema.json"
      - "acceptance/representation/snapshot_manifest/**"
      - "docs/contracts/interoperable-snapshot-manifest-v0.1.md"
      - "tools/shared_identity_registry.py"
      - "schemas/shared_identity_registry_v0.1.schema.json"
      - "acceptance/representation/shared_identity_registry_v0.1.json"
      - "docs/contracts/shared-identity-registry-v0.1.md"
      - "tools/ocdid_registry_validation.py"
      - "acceptance/representation/ocdid_registry_v0.1.json"
      - "docs/contracts/openstates-civicpatch-ocdid-validation-v0.1.md"
      - "tools/representation_semantics.py"
      - "acceptance/representation/**"
      - "docs/contracts/representation-role-post-membership-v0.1.md"
      - "tests/test_public_identity_disposition.py"
      - "tests/test_texas_bounded_contract.py"
      - "tests/test_tx_production_profile.py"
      - "tests/test_texas_activation_readiness.py"
      - "tests/test_tx_successor_package.py"
      - "tools/texas_bounded_contract.py"
      - "tools/texas_activation_readiness.py"
      - "tools/texas_successor_contract.py"
      - "consumers/empowered_vote/package_source.py"
      - "consumers/empowered_vote/representation.py"
      - "consumers/empowered_vote/production_profile.py"
      - "consumers/empowered_vote/package_catalog.py"
      - "consumers/empowered_vote/representation_catalog.py"
      - "data/packages/**"
      - "data/source/co/**"
      - "candidates/hi/hi-refresh-20260919/**"
      - "data/normalized/**"
      - "data/reference/co/**"
      - "docs/workflows/jurisdiction-package-v0.*.md"
      - "docs/workflows/public-identity-publication-v0.1.md"
      - "docs/workflows/texas-production-profile-v0.1.md"
      - "docs/workflows/texas-activation-readiness-v0.1.md"
      - "docs/workflows/texas-successor-package-v0.1.md"
      - ".github/workflows/jurisdiction-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jurisdiction-package:
    name: Jurisdiction Package gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Detect package implementation
        id: package
        shell: bash
        run: |
          if [[ -f tools/jurisdiction_package.py && -f tests/test_jurisdiction_package.py && -f tests/test_jurisdiction_package_v0_2.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap pass before package implementation exists
        if: steps.package.outputs.present != 'true'
        run: echo "Jurisdiction Package workflow installed; package implementation is not yet present on this branch."
      - uses: actions/setup-python@v5
        if: steps.package.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Compile generic, strict, exporter, Texas, and regression controls
        if: steps.package.outputs.present == 'true'
        run: python -m py_compile tools/hi_factory_refresh.py tests/test_hi_factory_refresh.py tools/jurisdiction_package.py tools/jurisdiction_package_strict.py tools/co_factory_export.py tools/texas_activation_readiness.py tools/texas_successor_contract.py consumers/empowered_vote/production_profile.py consumers/empowered_vote/package_catalog.py consumers/empowered_vote/representation_catalog.py consumers/empowered_vote/contract_v1.py consumers/empowered_vote/runtime_conformance.py consumers/empowered_vote/address_runtime.py consumers/civicpatch/adapter.py consumers/civicpatch/build_akron_pilot.py consumers/civicpatch/reconcile.py consumers/civicpatch/build_akron_partner_patch.py consumers/civicpatch/build_akron_upstream_handoff.py tools/export_representation.py civic_gps_extensions/local_geometry.py tools/geometry_governance.py tools/governed_geography_resolver.py tools/geocoding_boundary.py tools/representation_semantics.py tools/ocdid_registry_validation.py tools/shared_identity_registry.py tools/snapshot_manifest.py tools/assertion_governance.py tools/canonical_representation_core.py tests/test_jurisdiction_package.py tests/test_jurisdiction_package_v0_2.py tests/test_jurisdiction_package_strict.py tests/test_jurisdiction_package_adversarial.py tests/test_co_factory_export.py tests/test_package_archives.py tests/test_public_identity_disposition.py tests/test_representation_semantics.py tests/test_ocdid_registry_validation.py tests/test_shared_identity_registry.py tests/test_snapshot_manifest.py tests/test_assertion_governance.py tests/test_canonical_representation_core.py tests/test_civicpatch_akron_integration.py tests/test_civicpatch_akron_reconciliation.py tests/test_civicpatch_akron_upstream_handoff.py tests/test_export_representation.py tests/test_empowered_vote_runtime_conformance.py tests/test_geometry_governance.py tests/civic_gps_governed_local_overlay_test.py tests/test_governed_geography_resolver.py tests/test_geocoding_boundary.py tests/test_tx_production_profile.py tests/test_texas_activation_readiness.py tests/test_tx_successor_package.py
      - name: Run v0.1 legacy compatibility tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_jurisdiction_package.py
      - name: Run v0.2 election contract tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_jurisdiction_package_v0_2.py
      - name: Run strict deterministic package contract tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_jurisdiction_package_strict.py
      - name: Run D-329 Colorado factory export tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_co_factory_export.py
      - name: Run D-387 adversarial contract tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_jurisdiction_package_adversarial.py
      - name: Verify committed package archives
        if: steps.package.outputs.present == 'true'
        run: python tests/test_package_archives.py
      - name: Run RoleTerm identity and bounded representation controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_role_term_integration.py
      - name: Run role, post, membership, and internal-title semantics controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_representation_semantics.py
      - name: Run OpenStates/CivicPatch OCDID registry validation controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_ocdid_registry_validation.py
      - name: Run shared organization/person identity registry controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_shared_identity_registry.py
      - name: Run interoperable snapshot manifest controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_snapshot_manifest.py
      - name: Run partner assertion governance and certification controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_assertion_governance.py
      - name: Run canonical representation core closeout controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_canonical_representation_core.py
      - name: Run Factory to CivicPatch Akron integration controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_civicpatch_akron_integration.py
      - name: Run Akron CivicPatch identity reconciliation controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_civicpatch_akron_reconciliation.py
      - name: Run Akron CivicPatch upstream handoff controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_civicpatch_akron_upstream_handoff.py
      - name: Run generic multi-jurisdiction representation conformance controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_export_representation.py
      - name: Run Empowered Vote governed-address runtime controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_empowered_vote_runtime_conformance.py
      - name: Run governed district geometry controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_geometry_governance.py
      - name: Run governed local Civic GPS overlay controls
        if: steps.package.outputs.present == 'true'
        run: python tests/civic_gps_governed_local_overlay_test.py
      - name: Run governed coordinate resolver controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_governed_geography_resolver.py
      - name: Run governed geocoding boundary controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_geocoding_boundary.py
      - name: Verify bounded Hawaii refresh candidate
        if: steps.package.outputs.present == 'true'
        run: |
          python tests/test_hi_factory_refresh.py
          python tools/hi_factory_refresh.py --verify
          python tests/ev_kauai_countywide_preview_test.py
          python tests/ev_maui_countywide_preview_test.py
      - name: Run public identity publication controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_public_identity_disposition.py
      - name: Run bounded acceptance and production scope controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_texas_bounded_contract.py
      - name: Run bounded Texas production profile controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_tx_production_profile.py
      - name: Run Texas activation readiness contract controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_texas_activation_readiness.py
      - name: Run committed Texas successor package controls
        if: steps.package.outputs.present == 'true'
        run: python tests/test_tx_successor_package.py
