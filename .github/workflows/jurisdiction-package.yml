name: Jurisdiction Package contract

on:
  pull_request:
    paths:
      - "schemas/jurisdiction_package_v0.*.schema.json"
      - "tools/jurisdiction_package.py"
      - "tools/co_factory_export.py"
      - "tests/test_jurisdiction_package*.py"
      - "tests/test_co_factory_export.py"
      - "data/source/co/**"
      - "data/normalized/co/**"
      - "data/reference/co/**"
      - "docs/workflows/jurisdiction-package-v0.*.md"
      - ".github/workflows/jurisdiction-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jurisdiction-package:
    name: Jurisdiction Package gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Detect package implementation
        id: package
        shell: bash
        run: |
          if [[ -f tools/jurisdiction_package.py && -f tests/test_jurisdiction_package.py && -f tests/test_jurisdiction_package_v0_2.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap pass before package implementation exists
        if: steps.package.outputs.present != 'true'
        run: echo "Jurisdiction Package workflow installed; package implementation is not yet present on this branch."
      - uses: actions/setup-python@v5
        if: steps.package.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Compile builder, exporter, and tests
        if: steps.package.outputs.present == 'true'
        run: python -m py_compile tools/jurisdiction_package.py tools/co_factory_export.py tests/test_jurisdiction_package.py tests/test_jurisdiction_package_v0_2.py tests/test_co_factory_export.py
      - name: Run v0.1 compatibility tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_jurisdiction_package.py
      - name: Run v0.2 election contract tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_jurisdiction_package_v0_2.py
      - name: Run D-329 Colorado factory export tests
        if: steps.package.outputs.present == 'true'
        run: python tests/test_co_factory_export.py
