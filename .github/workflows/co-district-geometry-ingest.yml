name: Colorado district geometry ingest

on:
  pull_request:
    paths:
      - "tools/fetch_co_district_geometry.py"
      - ".github/workflows/co-district-geometry-ingest.yml"

permissions:
  contents: read

jobs:
  fetch:
    name: Fetch official district geometry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture Arvada Instant App discovery metadata
        run: |
          mkdir -p geometry-artifact
          python - <<'PY'
          import json, re, urllib.request
          from pathlib import Path

          app_id = "332a7eba6a4641999d278cfa6ee149f4"
          base = "https://www.arcgis.com/sharing/rest/content/items"

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "MightyLoud-CivicData-Geometry-Ingest/0.1"},
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.loads(response.read().decode())

          app_meta = get(f"{base}/{app_id}?f=json")
          app_data = get(f"{base}/{app_id}/data?f=json")
          ids = sorted(
              set(
                  re.findall(
                      r"(?i)\\b[0-9a-f]{32}\\b",
                      json.dumps(app_data),
                  )
              )
          )
          items = []
          for item_id in ids:
              try:
                  meta = get(f"{base}/{item_id}?f=json")
                  row = {
                      "id": item_id,
                      "title": meta.get("title"),
                      "type": meta.get("type"),
                      "url": meta.get("url"),
                      "owner": meta.get("owner"),
                  }
                  if meta.get("type") == "Web Map":
                      row["data"] = get(f"{base}/{item_id}/data?f=json")
                  items.append(row)
              except Exception as exc:
                  items.append({"id": item_id, "error": type(exc).__name__})

          out = {
              "app_metadata": app_meta,
              "app_data": app_data,
              "referenced_items": items,
          }
          Path("geometry-artifact/arvada_app_discovery.json").write_text(
              json.dumps(out, indent=2, sort_keys=True) + "\n"
          )
          print(
              json.dumps(
                  [
                      {key: value for key, value in row.items() if key != "data"}
                      for row in items
                  ],
                  indent=2,
              )
          )
          PY
      - name: Fetch and verify official polygons and control points
        run: |
          python tools/fetch_co_district_geometry.py \
            --output-root geometry-artifact
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("geometry-artifact")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["control_count"] == 8
          assert manifest["all_point_in_polygon_pass"] is True
          assert manifest["layers"]["alamosa"]["feature_count"] == 4
          assert manifest["layers"]["arvada"]["feature_count"] == 4
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: co-district-geometry-ingest
          path: geometry-artifact/
          if-no-files-found: error
          retention-days: 7
