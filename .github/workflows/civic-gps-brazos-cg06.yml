name: Civic GPS Brazos CG-06

on:
  push:
    branches:
      - agent/civic-gps-brazos-onboarding
    paths:
      - .github/workflows/civic-gps-brazos-cg06.yml
      - tests/fixtures/civic_gps_county_onboarding/brazos_county7_candidate_v0.1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brazos-cg06:
    name: Brazos interior canonical-join proof
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 'Check out County #7 branch'
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-civic-gps.txt

      - name: Install Civic GPS dependency
        run: python -m pip install -r requirements-civic-gps.txt

      - name: Reconstruct exact released runtime
        shell: bash
        run: |
          set -euo pipefail
          cat civic_gps_runtime_parts/part.* > civic_gps_runtime.zip
          echo '4ef210434e15f7f8353437f139a0918beaafb3734f62aedfb3d0852bfee241b2  civic_gps_runtime.zip' | sha256sum --check --strict
          unzip -q civic_gps_runtime.zip

      - name: Run unchanged released Civic GPS matrix
        shell: bash
        run: |
          set -euo pipefail
          python tests/civic_gps_live_smoke.py
          python tests/civic_gps_denton_live_probe.py
          python tests/civic_gps_denton_negative_probe.py
          python tests/civic_gps_denton_boundary_probe.py
          python tests/civic_gps_denton_action_probe.py
          python tests/civic_gps_collin_live_probe.py
          python tests/civic_gps_travis_live_probe.py
          python tests/civic_gps_williamson_live_probe.py
          python tests/civic_gps_tarrant_live_probe.py
          python tests/civic_gps_bastrop_live_probe.py

      - name: Generate Brazos candidate from frozen onboarding spec
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/civic-gps-brazos-cg06 artifacts/civic-gps-brazos-cg06-onboarding
          mkdir -p artifacts/civic-gps-brazos-cg06
          python tools/civic_gps_county_onboarding.py \
            tests/fixtures/civic_gps_county_onboarding/brazos_county7_candidate_v0.1.json \
            --output-dir artifacts/civic-gps-brazos-cg06-onboarding \
            --expect SUPPORTED_V0_1

      - name: Run Brazos CG-06 through unchanged engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import importlib.util
          import json
          import sys
          import time
          from pathlib import Path

          ROOT = Path('.')
          GPS = ROOT / 'civic_gps'
          OUT = ROOT / 'artifacts' / 'civic-gps-brazos-cg06'
          GENERATED = ROOT / 'artifacts' / 'civic-gps-brazos-cg06-onboarding'
          SPEC_PATH = ROOT / 'tests' / 'fixtures' / 'civic_gps_county_onboarding' / 'brazos_county7_candidate_v0.1.json'
          REGISTRY_PATH = GPS / 'registry.json'
          ENGINE_PATH = GPS / 'engine.py'
          RELEASE_NAME = 'civic_gps_brazos_county_v0.1.json'
          RELEASE_PATH = GPS / RELEASE_NAME
          J = 'jur-us-tx-brazos-county'
          A_COMM = 'DIST-TX-BRAZOS-COMMISSIONER'
          A_JP = 'DIST-TX-BRAZOS-JP'
          A_CONST = 'DIST-TX-BRAZOS-CONSTABLE'
          EXPECTED_ADAPTERS = {A_COMM, A_JP, A_CONST}
          POLICY = 'MULTIPLE_INTERSECTIONS => CONFLICT; NEVER TIE_BREAK'
          CANDIDATE_SPEC_SHA256 = '71e347e8383a7435a573cf72c7e75926e15859598c9c012109e99ac963877bdc'

          spec = json.loads(SPEC_PATH.read_text(encoding='utf-8'))
          canonical_spec = json.dumps(
              spec,
              ensure_ascii=False,
              sort_keys=True,
              separators=(',', ':'),
          ).encode('utf-8')
          actual_spec_sha = hashlib.sha256(canonical_spec).hexdigest()
          if actual_spec_sha != CANDIDATE_SPEC_SHA256:
              raise AssertionError(
                  f'CG-06 frozen candidate SHA changed: {actual_spec_sha}'
              )
          original_registry_bytes = REGISTRY_PATH.read_bytes()
          original_registry_sha = hashlib.sha256(original_registry_bytes).hexdigest()
          registry = json.loads(original_registry_bytes)
          if registry.get('engine_version') != '0.6.1' or registry.get('registry_artifact_version') != '0.5.6':
              raise AssertionError(
                  f"CG-06 requires released 0.6.1/0.5.6, got "
                  f"{registry.get('engine_version')}/{registry.get('registry_artifact_version')}"
              )
          if any(bundle.get('adapter_id') == 'ADAPTER-TX-BRAZOS' for bundle in registry.get('bundles', [])):
              raise AssertionError('Brazos must not already be packaged before CG-06')

          release = json.loads((GENERATED / 'canonical-release-preview.json').read_text(encoding='utf-8'))
          bundle = json.loads((GENERATED / 'base-bundle-plan.json').read_text(encoding='utf-8'))
          offices = release.get('payload', {}).get('offices', [])
          holders = release.get('payload', {}).get('officeholders', [])
          office_ids = {row.get('office_id') for row in offices}
          holder_ids = {row.get('office_id') for row in holders}
          if len(offices) != 18 or len(holders) != 18:
              raise AssertionError(f'Expected 18 offices/holders, got {len(offices)}/{len(holders)}')
          if len(office_ids) != 18 or office_ids != holder_ids:
              raise AssertionError('Brazos office/officeholder identity join failed')
          adapters = {row.get('adapter_id'): row for row in bundle.get('district_adapters', [])}
          if set(adapters) != EXPECTED_ADAPTERS:
              raise AssertionError(f'Unexpected Brazos adapters: {sorted(adapters)}')
          for adapter_id, adapter in adapters.items():
              if adapter.get('failure_scope') != 'ADAPTER':
                  raise AssertionError(f'{adapter_id} must remain ADAPTER-scoped')
              if adapter.get('officeholder_identity_source') != 'CANONICAL_RELEASE_ONLY':
                  raise AssertionError(f'{adapter_id} identity source changed')
              if adapter.get('boundary_policy') != POLICY:
                  raise AssertionError(f'{adapter_id} boundary policy changed')
          if bundle.get('action_registry_files'):
              raise AssertionError('Brazos action routing must remain unreleased')

          RELEASE_PATH.write_text(
              json.dumps(release, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          registry.setdefault('bundles', []).append(bundle)
          REGISTRY_PATH.write_text(
              json.dumps(registry, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )

          def load_module(name: str, path: Path):
              module_spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(module_spec)
              sys.modules[name] = mod
              assert module_spec.loader is not None
              module_spec.loader.exec_module(mod)
              return mod

          engine_mod = load_module('civic_gps_engine_brazos_cg06', ENGINE_PATH)
          resolver = engine_mod.CivicGPSOverlayEngine.from_file(REGISTRY_PATH, timeout_seconds=30.0)

          countywide_ids = {row['office_id'] for row in spec['scope']['countywide_offices']}
          if len(countywide_ids) != 6:
              raise AssertionError(f'Expected six bounded countywide IDs, got {countywide_ids}')
          expected_layers = {str(row['layer']) for row in spec['district_families']}

          CASES = [
              ('brazos-p1', '412 William D Fitch Parkway, College Station, TX 77845', '1', {
                  A_COMM: 'Bentley Nettles', A_JP: 'Kenny Elliott', A_CONST: 'Jeff Reeves'}),
              ('brazos-p2', '977 N FM 2038, Bryan, TX 77808', '2', {
                  A_COMM: 'Chuck Konderla', A_JP: 'Terrence P. Nunn', A_CONST: 'Donald Lampo'}),
              ('brazos-p3', '1500 George Bush Drive, College Station, TX 77840', '3', {
                  A_COMM: 'Fred Brown', A_JP: 'Rick Hill', A_CONST: 'J.P. Ingram'}),
              ('brazos-p4', '300 E 26th Street, Bryan, TX 77803', '4', {
                  A_COMM: 'Wanda J. Watson', A_JP: 'Darrell Booker', A_CONST: 'Hezekiah Carter, Jr.'}),
          ]

          TRANSIENT_CENSUS_MARKERS = (
              'timed out',
              'timeout',
              'connection',
              'temporarily unavailable',
              'remote disconnected',
              '502',
              '503',
              '504',
          )

          def resolve_with_bounded_census_retry(case_id: str, address: str):
              max_attempts = 3
              for attempt in range(1, max_attempts + 1):
                  result = resolver.resolve(address, observed_on=None)
                  error = result.get('error') or {}
                  details = error.get('details') or {}
                  upstream_error = str(details.get('error') or '').lower()
                  transient_census_failure = (
                      error.get('code') == 'UPSTREAM_REQUEST_FAILED'
                      and error.get('message') == 'GEOCODER request failed.'
                      and str(details.get('url') or '').startswith(
                          'https://geocoding.geo.census.gov/geocoder/'
                      )
                      and any(marker in upstream_error for marker in TRANSIENT_CENSUS_MARKERS)
                  )
                  if not error or not transient_census_failure or attempt == max_attempts:
                      return result, attempt
                  delay_seconds = 2 ** (attempt - 1)
                  print(
                      f'[{case_id}] transient Census geocoder failure on attempt '
                      f'{attempt}/{max_attempts}; retrying in {delay_seconds}s'
                  )
                  time.sleep(delay_seconds)
              raise AssertionError(f'[{case_id}] unreachable retry state')

          summaries = []
          keys_covered = set()
          for case_id, address, key, expected_reps in CASES:
              result, resolution_attempts = resolve_with_bounded_census_retry(case_id, address)
              (OUT / f'{case_id}.json').write_text(
                  json.dumps(result, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
                  encoding='utf-8',
              )
              if 'error' in result:
                  raise AssertionError(f'[{case_id}] engine error: {result["error"]}')
              payload = result['payload']
              if J not in {row.get('jurisdiction_id') for row in payload.get('jurisdictions') or []}:
                  raise AssertionError(f'[{case_id}] Brazos jurisdiction did not activate')
              assignments = {
                  row['adapter_id']: str(row['district_key'])
                  for row in payload.get('district_assignments') or []
                  if row.get('jurisdiction_id') == J
              }
              expected_assignments = {adapter_id: key for adapter_id in EXPECTED_ADAPTERS}
              if assignments != expected_assignments:
                  raise AssertionError(
                      f'[{case_id}] expected assignments {expected_assignments}, got {assignments}'
                  )
              representatives = {
                  row['adapter_id']: row.get('representative')
                  for row in payload.get('district_assignments') or []
                  if row.get('jurisdiction_id') == J
              }
              if representatives != expected_reps:
                  raise AssertionError(
                      f'[{case_id}] canonical representative mismatch: '
                      f'expected {expected_reps}, got {representatives}'
                  )

              applicable = [
                  row for row in payload.get('applicable_offices') or []
                  if row.get('jurisdiction_id') == J
              ]
              wide = [row for row in applicable if row.get('applicability_scope') == 'JURISDICTION_WIDE']
              district = [row for row in applicable if row.get('applicability_scope') == 'DISTRICT_MATCH']
              if (len(applicable), len(wide), len(district)) != (9, 6, 3):
                  raise AssertionError(
                      f'[{case_id}] expected 9 = 6 wide + 3 district, got '
                      f'{len(applicable)} = {len(wide)} + {len(district)}'
                  )
              wide_ids = {row.get('office_id') for row in wide}
              if wide_ids != countywide_ids:
                  raise AssertionError(f'[{case_id}] countywide office set mismatch: {wide_ids}')
              expected_district_ids = {
                  f'office-us-tx-brazos-county-commissioner-{key}',
                  f'office-us-tx-brazos-county-jp-{key}',
                  f'office-us-tx-brazos-county-constable-{key}',
              }
              district_ids = {row.get('office_id') for row in district}
              if district_ids != expected_district_ids:
                  raise AssertionError(
                      f'[{case_id}] district office set mismatch: '
                      f'expected {expected_district_ids}, got {district_ids}'
                  )
              if any(row.get('jurisdiction_id') == J for row in payload.get('action_links') or []):
                  raise AssertionError(f'[{case_id}] Brazos actions must remain unreleased')
              release_backed_layers = {
                  str(row.get('layer'))
                  for row in payload.get('coverage') or []
                  if row.get('status') == 'RELEASE_BACKED'
                  and str(row.get('layer') or '').startswith('brazos_county_')
              }
              if release_backed_layers != expected_layers:
                  raise AssertionError(
                      f'[{case_id}] expected coverage layers {expected_layers}, '
                      f'got {release_backed_layers}'
                  )

              keys_covered.add(key)
              summaries.append({
                  'case': case_id,
                  'address': address,
                  'key': key,
                  'assignments': assignments,
                  'representatives': representatives,
                  'wide_office_ids': sorted(wide_ids),
                  'district_office_ids': sorted(district_ids),
                  'coverage_layers': sorted(release_backed_layers),
                  'applicable_offices': 9,
                  'resolution_attempts': resolution_attempts,
                  'status': 'PASS',
              })

          if keys_covered != {'1', '2', '3', '4'}:
              raise AssertionError(
                  f'CG-06 controls must cover shared keys 1-4, got {sorted(keys_covered)}'
              )

          summary = {
              'status': 'PASS',
              'gate': 'CG-06',
              'county': 'Brazos County, TX',
              'geoid': '48041',
              'engine_version': '0.6.1',
              'released_registry_version': '0.5.6',
              'released_runtime_sha256': '4ef210434e15f7f8353437f139a0918beaafb3734f62aedfb3d0852bfee241b2',
              'original_registry_sha256': original_registry_sha,
              'candidate_spec_sha256': CANDIDATE_SPEC_SHA256,
              'candidate_overlay_only': True,
              'candidate_packaged': False,
              'release_offices': 18,
              'release_holders': 18,
              'controls': summaries,
              'shared_keys_covered': sorted(keys_covered, key=int),
              'normal_applicable_offices': 9,
              'normal_composition': {'countywide': 6, 'district': 3},
              'upstream_retry_policy': {
                  'scope': 'TRANSIENT_CENSUS_GEOCODER_TRANSPORT_ONLY',
                  'max_attempts': 3,
                  'backoff_seconds': [2, 4],
                  'deterministic_mismatches_retry': False,
              },
              'actions': 'NOT_YET_RELEASED',
              'next_gate': 'CG-07',
              'stopped_before': 'CG-07',
          }
          summary_path = OUT / 'brazos-cg06-summary.json'
          summary_path.write_text(
              json.dumps(summary, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(summary, ensure_ascii=False, sort_keys=True))
          print('BRAZOS CG-06 PASS')
          PY

      - name: Upload CG-06 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civic-gps-brazos-cg06-${{ github.run_id }}
          path: |
            artifacts/civic-gps-brazos-cg06/
            artifacts/civic-gps-brazos-cg06-onboarding/
          if-no-files-found: warn
          retention-days: 30
